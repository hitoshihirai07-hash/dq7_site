<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】ボス詳細｜弱点・耐性とダメージ計算</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7Rのボス詳細。弱点・耐性・メモを確認し、ダメージ計算で“あと何発”を見積もれます。" />
  <meta name="robots" content="noindex,follow" />
  <style>
    .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px;}
    .tabbtn{
      appearance:none; border:1px solid var(--line); background:#fff; color:var(--text);
      border-radius:999px; padding:6px 10px; font-size:12px; cursor:pointer;
    }
    .tabbtn.active{border-color:var(--accent2); background:rgba(232,137,47,.10);}
  </style>
</head>
<body>
<main>
  <div class="card" style="margin-bottom:12px;">
    <h1 style="margin-bottom:6px;">ボス詳細</h1>
    <p>ボス一覧から選んで開けます。</p>
  </div>

  <div id="wrap" class="grid two"></div>
<!-- seo-detail:start -->
<div class="card">
    <h2>ボス詳細の見方</h2>
    <p>このページでは、ボスの基本情報（弱点・耐性・メモなど）を確認できます。火力が足りるか不安なら、下のリンクからダメージ計算へ進んで“あと何発”を見積もるのが最短です。</p>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./damage.html">ダメージ計算</a>
      <a class="btn" href="./bosses.html">ボス一覧</a>
      <a class="btn" href="./spells.html">呪文</a>
      <a class="btn" href="./skills.html">特技</a>
    </div>
  </div>
<!-- seo-detail:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
                <a href="./updates.html">更新履歴</a>
<a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { getParam, escapeHTML } from "./assets/util.js";

  boot("ボス詳細 | DQ7R");

  const idParam = (getParam("id") || "").toString().trim();
  const WRAP = document.getElementById("wrap");

  const NA = '<span class="muted">—</span>';
  const disp = (v)=>{
    if (v === 0) return '0';
    const s = (v ?? '').toString().trim();
    return s ? escapeHTML(s) : NA;
  };

  const VALUE_LABEL = {
    weak: "弱点",
    normal: "等倍",
    half: "半減",
    immune: "無効",
    absorb: "吸収",
    "1": "弱点",
    "2": "等倍",
    "3": "軽減",
    "4": "無効"
  };

  const WIDE_RESIST_GROUPS = [
    { title:"属性", cols:["火","氷","風","土","雷","光","闇"] },
    { title:"能力低下", cols:["攻撃ダウン","守備ダウン","すばやさダウン"] },
    { title:"状態異常", cols:["ニフラム","即死","眠り","混乱","魅了","マヒ","毒","幻惑","転び","笑い","うっとり","みとれ"] }
  ];

  function trim(s){ return (s||"").toString().trim(); }

  // boss_id 末尾の A/B/C/D を分解
  function splitVariantId(bossId){
    const s = trim(bossId);
    const m = s.match(/^(.*?)(?:[_-])?([A-D])$/i);
    if (!m) return { base:s, variant:"" };
    return { base: m[1], variant: m[2].toUpperCase() };
  }
  function groupBosses(rows){
    const map = new Map();
    for (const r of rows){
      const id = trim(r.boss_id);
      if (!id) continue;
      const { base, variant } = splitVariantId(id);
      const item = { ...r, boss_id:id, _base:base, _variant:variant };
      if (!map.has(base)) map.set(base, { base, items:[] });
      map.get(base).items.push(item);
    }
    for (const g of map.values()){
      // 重要：並び順は CSV（boss_id の並び）を絶対に崩さない
      g.main = g.items[0];
      g.hasLetter = g.items.some(x => !!x._variant);
    }
    return map;
  }

  function groupBy(arr, key){
    const m = new Map();
    for (const x of arr){
      const k = x[key] || "";
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(x);
    }
    return m;
  }

  function renderLongResists(resistTypes, bossResists){
    const typeById = new Map(resistTypes.map(t=>[t.resist_type_id, t]));

    const enriched = bossResists.map(r=>{
      const t = typeById.get(r.resist_type_id) || {};
      return {
        category: t.category || "その他",
        name: t.name || r.resist_type_id,
        sort: Number(t.sort_order || 9999),
        value: (r.value || "").toLowerCase(),
        notes: r.notes || ""
      };
    }).sort((a,b)=>
      a.category.localeCompare(b.category,"ja") ||
      a.sort - b.sort ||
      a.name.localeCompare(b.name,"ja")
    );

    if (!enriched.length){
      return `<div class="card"><div class="warn">耐性データは未入力です。</div></div>`;
    }

    const grouped = groupBy(enriched, "category");
    let html = "";

    for (const [cat, items] of grouped.entries()){
      html += `<div class="card">
        <h2>${escapeHTML(cat)}</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>種別</th><th>耐性</th><th>メモ</th></tr></thead>
          <tbody>
            ${items.map(it=>{
              const label = VALUE_LABEL[it.value] || it.value || "—";
              return `<tr>
                <td>${escapeHTML(it.name)}</td>
                <td><span class="chip">${escapeHTML(label)}</span></td>
                <td>${escapeHTML(it.notes)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>
      </div>`;
    }
    return html;
  }

  function renderWideResists(row){
    if (!row) return `<div class="card"><div class="warn">耐性データは未入力です。</div></div>`;

    const hasAny = WIDE_RESIST_GROUPS.some(g => g.cols.some(col => trim(row[col])));
    if (!hasAny){
      return `<div class="card"><div class="warn">耐性データは未入力です。</div></div>`;
    }

    let html = `<div class="card"><div class="small muted">耐性目安：1=弱点 / 2=等倍 / 3=軽減 / 4=無効</div></div>`;

    for (const group of WIDE_RESIST_GROUPS){
      const items = group.cols
        .map((name, idx) => ({
          name,
          value: trim(row[name]),
          sort: idx
        }))
        .filter(x => x.value !== "");

      if (!items.length) continue;

      html += `<div class="card">
        <h2>${escapeHTML(group.title)}</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>種別</th><th>耐性</th><th>数値</th></tr></thead>
          <tbody>
            ${items.map(it=>{
              const label = VALUE_LABEL[it.value] || it.value || "—";
              return `<tr>
                <td>${escapeHTML(it.name)}</td>
                <td><span class="chip">${escapeHTML(label)}</span></td>
                <td>${escapeHTML(it.value)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>
      </div>`;
    }

    return html;
  }

  function renderResists(resistTypes, bossResists, bossWideResistsMap, bossId){
    const wideRow = bossWideResistsMap?.get(bossId);
    if (wideRow) return renderWideResists(wideRow);
    return renderLongResists(resistTypes, bossResists);
  }

  function makeRelated(mainBosses, currentGroupBase, loc){
    const others = mainBosses.filter(b => b._base !== currentGroupBase);
    let cand = others;
    if (loc){
      const same = others.filter(b => trim(b.location) === loc);
      if (same.length) cand = same.concat(others.filter(b => trim(b.location) !== loc));
    }
    return cand.slice(0,3);
  }

  async function main(){
    if (!idParam){
      WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">ボス一覧から選んでください。</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
      return;
    }

    const [bossRows, resistTypes, resistRows] = await Promise.all([
      loadCSV("./data/current/bosses.csv"),
      loadCSV("./data/current/resist_types.csv"),
      loadCSV("./data/current/boss_resists.csv")
    ]);

    const groups = groupBosses(bossRows);

    // idParam が boss_id そのものか、グループ（base）かを判定
    const exact = bossRows.find(r => trim(r.boss_id) === idParam);
    const base = exact ? splitVariantId(idParam).base : idParam;
    const group = groups.get(base);

    if (!group){
      WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">id=${escapeHTML(idParam)} が見つかりません。</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
      return;
    }

    const items = group.items;
    const mainBoss = group.main;

    // 関連ボスは「メイン（本ボス）」の location 基準
    const mainBosses = Array.from(groups.values()).map(g=>g.main);
    const loc = trim(mainBoss.location);
    const related = makeRelated(mainBosses, base, loc);
    const relatedHtml = related.length
      ? related.map(b=>`<a class="chip" href="./boss.html?id=${encodeURIComponent(b._base)}">${escapeHTML(b.name||b.boss_id||"")}</a>`).join(" ")
      : NA;

    // 同一戦闘（本ボス以外）を表示（一覧には出さないが詳細で紐づけ）
    const subs = items.filter(x => x.boss_id !== mainBoss.boss_id);
    const subsHtml = subs.length
      ? subs.map(s=>{
          const labelVar = s._variant ? `${s._variant}` : "sub";
          const labelName = escapeHTML(s.name || s.boss_id);
          return `<button class="tabbtn" data-bossid="${escapeHTML(s.boss_id)}" title="同一戦闘">${labelVar}: ${labelName}</button>`;
        }).join("")
      : "";

    // タブ
    const tabs = items.length > 1 ? items.map(it=>{
      // "" でもグループ内にA/Bがある場合は A 表示
      const v = it._variant || (group.hasLetter ? "A" : "");
      const label = v ? `${v}` : "単体";
      const tname = escapeHTML(it.name || it.boss_id);
      return `<button class="tabbtn" data-bossid="${escapeHTML(it.boss_id)}">${label}: ${tname}</button>`;
    }).join("") : "";

    WRAP.innerHTML = `
      <section class="card" id="leftCard">
        <div id="tabsWrap" style="${items.length > 1 ? "" : "display:none;"}">
          <div class="tabs" id="tabs">${tabs}</div>
        </div>

        <h1 id="bossName"></h1>
        <div class="small mono" id="bossId"></div>

        <p>
          <b>場所：</b><span id="bossLoc"></span><br>
          <b>フェーズ：</b><span id="bossPhase"></span>
        </p>

        <p><b>ステータス</b><br>
          HP：<span id="bossHP"></span>　
          攻撃：<span id="bossATK"></span>　
          防御：<span id="bossDEF"></span>　
          素早さ：<span id="bossAGI"></span>
        </p>

        <p>
          <a class="btn" id="dmgLink" href="#">このボスでダメージ計算</a>
        </p>

        <p><b>同一戦闘</b><br>
          <span id="bossSubs"></span>
        </p>

        <p><b>関連ボス</b><br>${relatedHtml}</p>

        <p><b>行動ざっくり</b><br><span id="bossActs"></span></p>
        <p><b>ドロップ</b><br><span id="bossDrop"></span></p>
        <p><b>経験値/ゴールド</b><br><span id="bossEG"></span></p>
        <p><b>メモ</b><br><span id="bossNotes"></span></p>

        <p class="small"><a href="./bosses.html">← ボス一覧へ戻る</a></p>
      </section>

      <section class="grid" id="rightCard"></section>
    `;

    const el = (id)=>document.getElementById(id);

    const isWideResistCsv = !!(resistRows[0] && !('resist_type_id' in resistRows[0]) && ('火' in resistRows[0] || '眠り' in resistRows[0]));
    const resistsByBossId = isWideResistCsv ? new Map() : groupBy(resistRows, "boss_id");
    const wideResistsByBossId = isWideResistCsv ? new Map(resistRows.map(r => [trim(r.boss_id), r])) : new Map();

    function setActive(bossId){
      const btns = document.querySelectorAll("#tabs .tabbtn");
      btns.forEach(b=>b.classList.toggle("active", b.dataset.bossid === bossId));
    }

    function update(bossId){
      const b = items.find(x => x.boss_id === bossId) || mainBoss;
      document.title = `${b.name || b.boss_id} | ボス詳細`;
      // meta description (for SERP snippet)
      const nm = (b.name || b.boss_id || "").toString();
      const md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', `DQ7Rのボス「${nm}」の詳細。弱点・耐性の確認と、ダメージ計算で“あと何発”の見積もり。`);


      el("bossName").innerHTML = escapeHTML(b.name || "");
      el("bossId").innerHTML = escapeHTML(b.boss_id || "");
      el("bossLoc").innerHTML = disp(b.location);
      el("bossPhase").innerHTML = disp(b.phase_count);
      el("bossHP").innerHTML = disp(b.hp);
      el("bossATK").innerHTML = disp(b.atk);
      el("bossDEF").innerHTML = disp(b.def);
      el("bossAGI").innerHTML = disp(b.agi);
      el("bossActs").innerHTML = disp(b.actions_summary);
      el("bossDrop").innerHTML = disp(b.drop_items);
      el("bossEG").innerHTML = `${disp(b.exp)} / ${disp(b.gold)}`;
      el("bossNotes").innerHTML = disp(b.notes);

      el("dmgLink").href = `./damage.html?boss=${encodeURIComponent(b.boss_id || "")}`;

      // 同一戦闘の表示：本ボス以外をチップに（タブがある場合はタブで切替可）
      const other = items.filter(x => x.boss_id !== b.boss_id);
      el("bossSubs").innerHTML = other.length
        ? other.map(o=>{
            const v = o._variant || (group.hasLetter ? "A" : "");
            const lab = v ? `${v}` : "sub";
            const nm = escapeHTML(o.name || o.boss_id);
            return `<a class="chip" href="./boss.html?id=${encodeURIComponent(o.boss_id)}" style="margin-right:6px;">${lab}: ${nm}</a>`;
          }).join("")
        : `<span class="muted">—</span>`;

      const rs = resistsByBossId.get(b.boss_id) || [];
      el("rightCard").innerHTML = renderResists(resistTypes, rs, wideResistsByBossId, b.boss_id);

      setActive(b.boss_id);
    }

    if (items.length > 1){
      document.getElementById("tabs").addEventListener("click", (ev)=>{
        const t = ev.target.closest(".tabbtn");
        if (!t) return;
        const bid = t.dataset.bossid;
        if (!bid) return;
        update(bid);
      });
    }

    // 初期選択：URLが variant id を指していればそれを優先
    const initial = exact ? trim(exact.boss_id) : trim(mainBoss.boss_id);
    update(initial);
  }

  main().catch(err=>{
    WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">${escapeHTML(err.message || String(err))}</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
  });
</script>
</body>
</html>
