<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>ボス詳細</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7R のボス詳細ページ。" />
</head>
<body>
<main>
<div class="card" style="margin-bottom:12px;"><h1 style="margin-bottom:6px;">ボス詳細</h1><p>ボス一覧から選んで開けます。</p></div>
  <div id="wrap" class="grid two"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV, byId } from "./assets/data.js";
  import { getParam, escapeHTML } from "./assets/util.js";

  boot("ボス詳細 | DQ7R");

  const id = getParam("id") || "";
  const WRAP = document.getElementById("wrap");

  const NA = '<span class="muted">—</span>';
  const disp = (v)=>{
    if (v === 0) return '0';
    const s = (v ?? '').toString().trim();
    return s ? escapeHTML(s) : NA;
  };

  const VALUE_LABEL = {
    weak: "弱点",
    normal: "等倍",
    half: "半減",
    immune: "無効",
    absorb: "吸収"
  };

  function groupBy(arr, key){
    const m = new Map();
    for (const x of arr){
      const k = x[key] || "";
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(x);
    }
    return m;
  }

  function renderResists(resistTypes, bossResists){
    const typeById = new Map(resistTypes.map(t=>[t.resist_type_id, t]));

    const enriched = bossResists.map(r=>{
      const t = typeById.get(r.resist_type_id) || {};
      return {
        category: t.category || "その他",
        name: t.name || r.resist_type_id,
        sort: Number(t.sort_order || 9999),
        value: (r.value || "").toLowerCase(),
        notes: r.notes || ""
      };
    }).sort((a,b)=>
      a.category.localeCompare(b.category,"ja") ||
      a.sort - b.sort ||
      a.name.localeCompare(b.name,"ja")
    );

    if (!enriched.length){
      return `<div class="card"><div class="warn">耐性データは未入力です。</div></div>`;
    }

    const grouped = groupBy(enriched, "category");
    let html = "";

    for (const [cat, items] of grouped.entries()){
      html += `<div class="card">
        <h2>${escapeHTML(cat)}</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>種別</th><th>耐性</th><th>メモ</th></tr></thead>
          <tbody>
            ${items.map(it=>{
              const label = VALUE_LABEL[it.value] || it.value || "—";
              return `<tr>
                <td>${escapeHTML(it.name)}</td>
                <td><span class="chip">${escapeHTML(label)}</span></td>
                <td>${escapeHTML(it.notes)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>
      </div>`;
    }
    return html;
  }

  async function main(){
    if (!id){
      WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">ボス一覧から選んでください。</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
      return;
    }

    const [bosses, resistTypes, bossResists] = await Promise.all([
      loadCSV("./data/current/bosses.csv"),
      loadCSV("./data/current/resist_types.csv"),
      loadCSV("./data/current/boss_resists.csv")
    ]);

    const boss = byId(bosses, "boss_id", id);
    if (!boss){
      WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">id=${escapeHTML(id)} が見つかりません。</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
      return;
    }

    document.title = `${boss.name || boss.boss_id} | ボス詳細`;

    const resists = bossResists.filter(r => (r.boss_id || "") === id);

    const loc = (boss.location||"").toString().trim();
    const others = bosses.filter(b => (b.boss_id||"").toString().trim() && (b.boss_id||"").toString().trim() !== id);
    let cand = others;
    if (loc){
      const same = others.filter(b => (b.location||"").toString().trim() === loc);
      if (same.length) cand = same.concat(others.filter(b => (b.location||"").toString().trim() !== loc));
    }
    const related = cand.slice(0,3);
    const relatedHtml = related.length ? related.map(b=>`<a class="chip" href="./boss.html?id=${encodeURIComponent((b.boss_id||"").toString().trim())}">${escapeHTML(b.name||b.boss_id||"")}<\/a>`).join(' ') : NA;

    const left = `
      <section class="card">
        <h1>${escapeHTML(boss.name || "")}</h1>
        <div class="small mono">${escapeHTML(boss.boss_id || "")}</div>

        <p>
          <b>場所：</b>${disp(boss.location)}<br>
          <b>フェーズ：</b>${disp(boss.phase_count)}
        </p>

        <p><b>ステータス</b><br>
          HP：${disp(boss.hp)}　
          攻撃：${disp(boss.atk)}　
          防御：${disp(boss.def)}　
          素早さ：${disp(boss.agi)}
        </p>

        <p>
          <a class="btn" href="./damage.html?boss=${encodeURIComponent(boss.boss_id || "")}">このボスでダメージ計算</a>
        </p>

        <p><b>関連ボス</b><br>${relatedHtml}</p>

        <p><b>行動ざっくり</b><br>${disp(boss.actions_summary)}</p>
        <p><b>ドロップ</b><br>${disp(boss.drop_items)}</p>
        <p><b>経験値/ゴールド</b><br>${disp(boss.exp)} / ${disp(boss.gold)}</p>
        <p><b>メモ</b><br>${disp(boss.notes)}</p>

        <p class="small"><a href="./bosses.html">← ボス一覧へ戻る</a></p>
      </section>
    `;

    const right = `<section class="grid">${renderResists(resistTypes, resists)}</section>`;

    WRAP.innerHTML = left + right;
  }

  main().catch(err=>{
    WRAP.innerHTML = `<div class="card"><h1>ボス詳細</h1><div class="warn">${escapeHTML(err.message || String(err))}</div><p><a href="./bosses.html">← ボス一覧へ</a></p></div>`;
  });
</script>
</body>
</html>
