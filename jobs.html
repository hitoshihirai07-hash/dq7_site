<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>職業</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7R の職業一覧。検索・絞り込み対応。" />
</head>
<body>
<main>
  <div class="card">
    <h1>職業</h1>

    <p>職業を一覧表示します。検索で絞り込み、名前を押すと詳細ページに移動します。</p>

    

    <style>
      /* jobs route helper */
      .route-wrap{display:grid; gap:12px; grid-template-columns:1fr; margin:12px 0 4px;}
      @media (min-width: 920px){ .route-wrap{grid-template-columns: 1fr 1fr;} }
      .route-panel{border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff;}
      .route-panel h2{margin:0 0 8px;}
      .route-lines{display:flex; flex-direction:column; gap:6px;}
      .route-line{display:flex; gap:8px; align-items:center; flex-wrap:wrap; line-height:1.5;}
      .route-line .arrow{opacity:.7}
      .route-line a{font-weight:700}
      .route-badge{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--text);}
      .route-picks{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
      .route-pick{display:inline-flex; gap:6px; align-items:center; padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#fff;}
      .route-pick input{transform: translateY(0.5px);}
      .route-steps ol{margin:8px 0 0; padding-left:18px;}
      .route-steps li{margin:4px 0; color:var(--text);}
      .route-muted{color:var(--muted);}
      .route-warn{margin-top:8px;}
    </style>

    <div class="route-wrap">
      <section class="route-panel">
        <h2>早見表</h2>
        <div id="jobQuickRef" class="route-lines small">読み込み中...</div>
      </section>

      <section class="route-panel">
        <h2>ルートナビ</h2>
        <div class="toolbar" style="margin:0;">
          <select id="routeTarget"></select>
          <div id="routePicks" class="route-picks"></div>
        </div>
        <div id="routeOut" class="route-steps" style="margin-top:10px;"></div>
      </section>
    </div>

<div class="toolbar">
      <input id="q" class="input" placeholder="検索（名前 / 解放条件 / メモ）" />
      <select id="group">
        <option value="all">グループ：すべて</option>
      </select>
</div>

    <div id="out" style="margin-top:12px;"></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>
<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { qs, escapeHTML, makeTable } from "./assets/util.js";

  boot("職業 | DQ7R");

  const Q = qs("#q");
  const GROUP = qs("#group");
  const OUT = qs("#out");

  const ROUTE_TARGET = qs("#routeTarget");
  const ROUTE_PICKS = qs("#routePicks");
  const ROUTE_OUT = qs("#routeOut");
  const QUICK = qs("#jobQuickRef");


  const cols = [
    {
      key:"name",
      label:"職業",
      render:(r)=>{
        const id = (r.job_id || "").trim();
        const name = escapeHTML(r.name || "");
        return `<a href="./job.html?id=${encodeURIComponent(id)}">${name}</a>`;
      }
    },
    { key:"group", label:"系統" },
    { key:"unlock_condition", label:"条件" },
    {
      key:"bonus",
      label:"補正",
      render:(r)=> escapeHTML(formatBonus_(r))
    },
    { key:"job_traits", label:"特性" },
    { key:"notes", label:"メモ" },
  ];

  function norm(s){ return (s||"").toLowerCase(); }

  function stageMark_(v){
    const s = (v ?? "").toString().trim();
    if (!s) return "－";
    if (s === "↑" || s === "↓" || s === "－") return s;
    if (s === "-") return "－";
    // accept "+10", "10", "-10", "+10%", "10%" (legacy)
    const num = parseFloat(s.replace("%",""));
    if (Number.isNaN(num) || num === 0) return "－";
    return num > 0 ? "↑" : "↓";
  }

  function formatBonus_(r){
    const pairs = [
      ["HP", stageMark_(r.hp_pct)],
      ["MP", stageMark_(r.mp_pct)],
      ["攻", stageMark_(r.str_pct)],
      ["守", stageMark_(r.def_pct)],
      ["攻魔", stageMark_(r.atk_magic_pct ?? r.int_pct)],
      ["回魔", stageMark_(r.heal_magic_pct)],
      ["魅", stageMark_(r.charm_pct)],
      ["早", stageMark_(r.agi_pct)],
      ["器", stageMark_(r.dex_pct)],
    ];

    const shown = pairs.filter(([k,v]) => v !== "－");
    if (!shown.length) return "－";
    return shown.map(([k,v]) => `${k}${v}`).join(" ");
  }


  // ---- 職業ルート（早見表 / ナビ） ----
  function parseUnlock_(s){
    const t = (s||"").trim();
    if (!t) return { kind:"none" };
    if (t.includes("最初から")) return { kind:"none" };

    // 勇者: 上級職3つ以上をマスター
    const mGroup = t.match(/上級職\s*([0-9０-９]+)\s*つ以上をマスター/);
    if (mGroup){
      const n = parseInt(mGroup[1].replace(/[０-９]/g, d => "０１２３４５６７８９".indexOf(d)), 10);
      return { kind:"group", group:"上級職", count: Number.isFinite(n) ? n : 3 };
    }

    // 「A、B、Cのいずれか2つをマスター」
    const mPick = t.match(/(.+?)のいずれか\s*([0-9０-９]+)\s*つをマスター/);
    if (mPick){
      const raw = mPick[1];
      const n = parseInt(mPick[2].replace(/[０-９]/g, d => "０１２３４５６７８９".indexOf(d)), 10);
      const names = raw.split(/[、,]/).map(x=>x.trim()).filter(Boolean);
      return { kind:"pick", names, count: Number.isFinite(n) ? n : 2 };
    }

    // 「A、Bをマスター」 / 「A、B、Cをマスター」
    const mList = t.match(/(.+?)をマスター/);
    if (mList){
      const names = mList[1].split(/[、,]/).map(x=>x.trim()).filter(Boolean);
      return { kind:"list", names, count: names.length };
    }

    return { kind:"text", text:t };
  }

  function buildNameMap_(jobs){
    const map = {};
    for (const r of jobs){
      const name = (r.name||"").trim();
      if (!name) continue;
      map[name] = (r.job_id||"").trim();
    }
    return map;
  }

  function linkJob_(name, nameToId){
    const id = nameToId[name];
    const safe = escapeHTML(name||"");
    if (!id) return safe;
    return `<a href="./job.html?id=${encodeURIComponent(id)}">${safe}</a>`;
  }

  function fmtReqText_(req, nameToId){
    if (!req || req.kind === "none") return "最初から";
    if (req.kind === "group") return `上級職${req.count}つ以上`;
    if (req.kind === "pick") return `(${req.names.map(n=>linkJob_(n,nameToId)).join(" / ")} のうち${req.count}つ)`;
    if (req.kind === "list") return req.names.map(n=>linkJob_(n,nameToId)).join(" ＋ ");
    if (req.kind === "text") return escapeHTML(req.text);
    return "－";
  }

  function uniqPush_(arr, set, v){
    if (set.has(v)) return;
    set.add(v);
    arr.push(v);
  }

  function stepsToMaster_(jobName, jobByName, nameToId, out, visited){
    if (!jobName || visited.has(jobName)) return;
    visited.add(jobName);

    const job = jobByName[jobName];
    const req = parseUnlock_(job ? job.unlock_condition : "");

    // 前提があるなら先にそっちをマスター（＝この職をマスターするための最短）
    if (req.kind === "list"){
      for (const p of req.names){
        stepsToMaster_(p, jobByName, nameToId, out, visited);
      }
    } else if (req.kind === "pick"){
      // pick はここでは「この職をマスターする」用途では使わない想定
      // （ナビ側で選択を受け取って prerequisites として処理）
    } else if (req.kind === "group"){
      // 同上
    }
    out.push(jobName);
  }

  function renderQuickRef_(jobs, nameToId){
    const adv = jobs.filter(r=>(r.group||"").trim()==="上級職");
    const master = jobs.filter(r=>(r.group||"").trim()==="マスター職");

    const lines = [];

    function addSection(title){
      lines.push(`<div class="route-line"><span class="route-badge">${escapeHTML(title)}</span><span class="route-muted">条件</span></div>`);
    }

    addSection("上級職");
    for (const r of adv){
      const target = (r.name||"").trim();
      const req = parseUnlock_(r.unlock_condition);
      const left = fmtReqText_(req, nameToId);
      lines.push(`<div class="route-line">${left} <span class="arrow">→</span> ${linkJob_(target, nameToId)}</div>`);
    }

    lines.push(`<div style="margin:8px 0;border-top:1px solid var(--line)"></div>`);

    addSection("マスター職");
    for (const r of master){
      const target = (r.name||"").trim();
      const req = parseUnlock_(r.unlock_condition);
      const left = fmtReqText_(req, nameToId);
      lines.push(`<div class="route-line">${left} <span class="arrow">→</span> ${linkJob_(target, nameToId)}</div>`);
    }

    QUICK.innerHTML = `<div class="route-lines">${lines.join("")}</div>`;
  }

  function initRouteNav_(jobs){
    const nameToId = buildNameMap_(jobs);
    const jobByName = {};
    for (const r of jobs){
      const n = (r.name||"").trim();
      if (n) jobByName[n] = r;
    }

    const adv = jobs.filter(r=>(r.group||"").trim()==="上級職").map(r=>(r.name||"").trim());
    const master = jobs.filter(r=>(r.group||"").trim()==="マスター職").map(r=>(r.name||"").trim());

    // option build
    const optAdv = adv.map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("");
    const optMaster = master.map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("");
    ROUTE_TARGET.innerHTML =
      `<option value="">目標: 選択</option>` +
      `<optgroup label="上級職">${optAdv}</optgroup>` +
      `<optgroup label="マスター職">${optMaster}</optgroup>`;

    function getDefaultPicks_(req){
      if (req.kind === "pick"){
        return req.names.slice(0, req.count);
      }
      if (req.kind === "group"){
        // 勇者: 上級職の中から定番3つ（なければ先頭から）
        const prefer = ["バトルマスター","パラディン","賢者"];
        const picked = [];
        for (const p of prefer){
          if (adv.includes(p) && !picked.includes(p)) picked.push(p);
        }
        for (const a of adv){
          if (picked.length >= req.count) break;
          if (!picked.includes(a)) picked.push(a);
        }
        return picked;
      }
      if (req.kind === "list") return req.names.slice();
      return [];
    }

    function renderPicks_(req, picked){
      ROUTE_PICKS.innerHTML = "";
      if (req.kind !== "pick" && req.kind !== "group") return;

      const names = (req.kind === "group") ? adv : req.names;
      const need = req.count;

      // label
      const lab = document.createElement("span");
      lab.className = "small route-muted";
      lab.textContent = (req.kind === "group") ? `上級職を${need}つ以上選択` : `${need}つ選択`;
      ROUTE_PICKS.appendChild(lab);

      for (const name of names){
        const id = `pick_${name}`;
        const label = document.createElement("label");
        label.className = "route-pick";
        label.setAttribute("for", id);

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = id;
        cb.value = name;
        cb.checked = picked.includes(name);

        const span = document.createElement("span");
        span.textContent = name;

        cb.addEventListener("change", (ev)=>{
          const sel = getPicked_();
          if (req.kind === "pick" && sel.length > need){
            // fixed count: revert
            cb.checked = false;
          }
          update_();
        });

        label.appendChild(cb);
        label.appendChild(span);
        ROUTE_PICKS.appendChild(label);
      }

      update_();
    }

    function getPicked_(){
      const cbs = Array.from(ROUTE_PICKS.querySelectorAll('input[type="checkbox"]'));
      return cbs.filter(x=>x.checked).map(x=>x.value);
    }

    function renderOut_(targetName, req, picked){
      if (!targetName){
        ROUTE_OUT.innerHTML = `<div class="small route-muted">上級職 / マスター職を選ぶと、必要な“マスター順”を表示します。</div>`;
        return;
      }

      // prerequisites
      let prereqs = [];
      if (req.kind === "list") prereqs = req.names.slice();
      else if (req.kind === "pick") prereqs = picked.slice();
      else if (req.kind === "group") prereqs = picked.slice();
      else prereqs = [];

      // validation
      if (req.kind === "pick" && prereqs.length !== req.count){
        ROUTE_OUT.innerHTML = `<div class="warn route-warn">選択数が足りません（${req.count}つ選択）</div>`;
        return;
      }
      if (req.kind === "group" && prereqs.length < req.count){
        ROUTE_OUT.innerHTML = `<div class="warn route-warn">選択数が足りません（上級職を${req.count}つ以上）</div>`;
        return;
      }

      // steps: master prereq jobs (and their prerequisites)
      const steps = [];
      const visited = new Set();
      for (const p of prereqs){
        const buf = [];
        stepsToMaster_(p, jobByName, nameToId, buf, visited);
        // stepsToMaster_ pushes in dependency order but includes duplicates inside visited check
        for (const x of buf) steps.push(x);
      }

      // render
      const needText = (req.kind==="none") ? "最初から" : fmtReqText_(req, nameToId);
      const li = steps.map(n=>`<li>${linkJob_(n,nameToId)}をマスター</li>`).join("");

      const end = `<div class="small route-muted" style="margin-top:8px;">最後：${linkJob_(targetName,nameToId)}へ転職</div>`;

      ROUTE_OUT.innerHTML = `
        <div class="small route-muted">目標：${linkJob_(targetName,nameToId)}</div>
        <div class="small route-muted">条件：${needText}</div>
        <ol>${li || "<li>（前提なし）</li>"}</ol>
        ${end}
      `;
    }

    function update_(){
      const targetName = (ROUTE_TARGET.value||"").trim();
      const job = jobByName[targetName];
      const req = parseUnlock_(job ? job.unlock_condition : "");
      const picked = getPicked_();
      renderOut_(targetName, req, picked);
    }

    ROUTE_TARGET.addEventListener("change", ()=>{
      const targetName = (ROUTE_TARGET.value||"").trim();
      const job = jobByName[targetName];
      const req = parseUnlock_(job ? job.unlock_condition : "");
      const picked = getDefaultPicks_(req);
      renderPicks_(req, picked);
      update_();
    });

    // initial
    ROUTE_OUT.innerHTML = `<div class="small route-muted">上級職 / マスター職を選ぶと、必要な“マスター順”を表示します。</div>`;
  }


  async function main(){
    const jobs = await loadCSV("./data/current/jobs.csv");

    // route helper
    const nameToId = buildNameMap_(jobs);
    renderQuickRef_(jobs, nameToId);
    initRouteNav_(jobs);


    // group options
    const groups = Array.from(new Set(jobs.map(r=>(r.group||"").trim()).filter(Boolean)))
      .sort((a,b)=>a.localeCompare(b,"ja"));
    GROUP.innerHTML = `<option value="all">系統: 全て</option>` + groups.map(g=>`<option value="${escapeHTML(g)}">${escapeHTML(g)}</option>`).join("");

    function render(){
      const q = norm(Q.value.trim());
      const g = GROUP.value;

      const filtered = jobs.filter(r=>{
        if (g !== "all" && (r.group||"").trim() !== g) return false;
        if (!q) return true;
        const blob = [
          r.job_id,r.name,r.group,r.unlock_condition,r.job_traits,r.notes,
          r.hp_pct,r.mp_pct,r.str_pct,r.def_pct,r.agi_pct,r.int_pct,r.charm_pct,r.atk_magic_pct,r.heal_magic_pct,r.dex_pct
        ].join(" ").toLowerCase();
        return blob.includes(q);
      });

      OUT.innerHTML = makeTable(filtered, cols) +
        `<div class="small" style="margin-top:8px;">件数: ${filtered.length}</div>`;
    }

    Q.addEventListener("input", render);
    GROUP.addEventListener("change", render);
    render();
  }

  main().catch(err=>{
    OUT.innerHTML = `<div class="warn">${escapeHTML(err.message || String(err))}</div>`;
  });
</script>
</body>
</html>
