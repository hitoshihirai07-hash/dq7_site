<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>ダメージ計算</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="攻撃力・防御力・倍率・乱数・耐性からダメージ範囲と討伐回数の目安を計算します。" />
</head>
<body>
<main>
  <div class="card">
    <h1>ダメージ計算</h1>
    <p class="small">※非公式ファンサイトです。掲載情報は参考用です。</p>

    <div class="toolbar" style="flex-wrap:wrap; gap:8px">
      <label class="small">ボス</label>
      <select id="boss" class="select" style="min-width:220px"></select>

      <label class="small">属性</label>
      <select id="element" class="select" style="min-width:160px"></select>

      <label class="small">相手耐性</label>
      <select id="resist" class="select" style="min-width:120px"></select>

      <label class="small">倍率</label>
      <input id="resistMul" class="input" style="width:90px" inputmode="decimal" placeholder="1.0" />
    </div>

    <div class="grid two" style="margin-top:12px">
      <div>
        <h2 style="margin:0 0 8px">入力</h2>

        <div class="toolbar" style="flex-wrap:wrap; gap:8px">
          <label class="small">攻撃力</label>
          <input id="atk" class="input" style="width:110px" inputmode="numeric" placeholder="例: 200" />

          <label class="small">相手防御</label>
          <input id="def" class="input" style="width:110px" inputmode="numeric" placeholder="例: 120" />

          <label class="small">技倍率</label>
          <input id="mult" class="input" style="width:90px" inputmode="decimal" placeholder="1.0" />

          <label class="small">固定加算</label>
          <input id="add" class="input" style="width:90px" inputmode="numeric" placeholder="0" />
        </div>

        <div class="toolbar" style="flex-wrap:wrap; gap:8px; margin-top:10px">
          <label class="small">乱数(最小)</label>
          <input id="randMin" class="input" style="width:90px" inputmode="decimal" placeholder="1.00" />

          <label class="small">乱数(最大)</label>
          <input id="randMax" class="input" style="width:90px" inputmode="decimal" placeholder="1.00" />

          <label class="small">自分耐性</label>
          <input id="selfMul" class="input" style="width:90px" inputmode="decimal" placeholder="1.00" />

          <label class="small">敵HP</label>
          <input id="hp" class="input" style="width:110px" inputmode="numeric" placeholder="任意" />
        </div>

        <details style="margin-top:10px">
          <summary style="cursor:pointer"><b>式設定（必要なら）</b> <span class="small">※ここだけ触れば「元の既存式」に合わせられます</span></summary>
          <div class="toolbar" style="flex-wrap:wrap; gap:8px; margin-top:10px">
            <label class="small">攻撃係数</label>
            <input id="atkCoef" class="input" style="width:90px" inputmode="decimal" placeholder="1.0" />

            <label class="small">防御係数</label>
            <input id="defCoef" class="input" style="width:90px" inputmode="decimal" placeholder="0.5" />
          </div>
          <p class="small" style="margin:10px 0 0">
            計算部は <code>assets/damage_calc.js</code> の <code>computeBaseDamage()</code> だけです。
            あなたの既存式がある場合、そこを差し替えればこのページはそのまま使えます。
          </p>
        </details>

        <div class="toolbar" style="margin-top:12px">
          <button id="calc" class="btn">計算</button>
          <button id="reset" class="btn btn-secondary" type="button">リセット</button>
          <span id="bossInfo" class="small"></span>
        </div>
      </div>

      <div>
        <h2 style="margin:0 0 8px">結果</h2>
        <div id="out" class="card" style="margin:0; padding:12px"></div>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { escapeHTML, qs } from "./assets/util.js";
  import {
    RESIST_LABEL,
    toNum,
    getResistMul,
    computeBaseDamage,
    computeDamageRange,
    computeHitsToKill
  } from "./assets/damage_calc.js";

  boot("ダメージ計算 | DQ7R");

  const EL = {
    boss: qs("#boss"),
    element: qs("#element"),
    resist: qs("#resist"),
    resistMul: qs("#resistMul"),
    atk: qs("#atk"),
    def: qs("#def"),
    mult: qs("#mult"),
    add: qs("#add"),
    randMin: qs("#randMin"),
    randMax: qs("#randMax"),
    selfMul: qs("#selfMul"),
    hp: qs("#hp"),
    atkCoef: qs("#atkCoef"),
    defCoef: qs("#defCoef"),
    out: qs("#out"),
    bossInfo: qs("#bossInfo"),
    calc: qs("#calc"),
    reset: qs("#reset"),
  };

  function opt(value, label){
    const o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    return o;
  }

  function renderOut({ base, range, resistMul, hits }){
    const fmt = (n)=> (n==null || !Number.isFinite(n)) ? "—" : String(Math.round(n*100)/100);
    const intFmt = (n)=> (n==null || !Number.isFinite(n)) ? "—" : String(n);

    EL.out.innerHTML = `
      <div class="small">相手耐性倍率: <b>${escapeHTML(fmt(resistMul))}</b></div>
      <div style="margin-top:8px">
        <div>基礎ダメージ: <b>${escapeHTML(intFmt(base))}</b></div>
        <div>ダメージ範囲: <b>${escapeHTML(intFmt(range.min))}</b> ～ <b>${escapeHTML(intFmt(range.max))}</b>
          <span class="small">（平均 ${escapeHTML(fmt(range.avg))}）</span>
        </div>
      </div>
      <hr style="margin:12px 0; opacity:.2" />
      <div>
        <div>討伐回数の目安（敵HP入力時）</div>
        <div class="small" style="margin-top:6px">
          最短: <b>${escapeHTML(intFmt(hits.best))}</b>　/　平均: <b>${escapeHTML(intFmt(hits.avg))}</b>　/　最長: <b>${escapeHTML(intFmt(hits.worst))}</b>
        </div>
        <div class="small" style="margin-top:6px">※ダメージが0以下になる条件では回数は表示しません。</div>
      </div>
    `;
  }

  function fillDefaultIfEmpty(input, v){
    if (!input.value) input.value = (v ?? "").toString();
  }

  let bosses = [];
  let resistTypes = [];
  let bossResists = [];

  function getSelectedBoss(){
    const id = (EL.boss.value || "").toString();
    return bosses.find(b => (b.boss_id || "").toString() === id) || null;
  }

  function bossResistValue(boss_id, resist_type_id){
    const row = bossResists.find(r => (r.boss_id || "") === boss_id && (r.resist_type_id || "") === resist_type_id);
    return row ? (row.value || "").toString().trim() : "";
  }

  function setBossInfo(){
    const b = getSelectedBoss();
    if (!b){
      EL.bossInfo.textContent = "";
      return;
    }
    const loc = (b.location || "").toString().trim();
    EL.bossInfo.textContent = loc ? `場所: ${loc}` : "";
  }

  function applyBossDefaults(){
    const b = getSelectedBoss();
    if (!b) return;
    // 明確な入力があるときは上書きしない（事故防止）
    fillDefaultIfEmpty(EL.hp, b.hp);
    fillDefaultIfEmpty(EL.def, b.def);
  }

  function applyResistFromBoss(){
    const b = getSelectedBoss();
    const rt = (EL.element.value || "").toString();
    if (!b || !rt) return;

    const v = bossResistValue((b.boss_id || "").toString(), rt);
    if (!v) return;

    // 抜け値は normal 扱い
    const key = ["weak","normal","half","immune","absorb"].includes(v) ? v : "normal";
    EL.resist.value = key;
  }

  function syncResistMulUI(){
    const key = (EL.resist.value || "normal").toString();
    if (key === "custom"){
      EL.resistMul.disabled = false;
      EL.resistMul.placeholder = "1.0";
      return;
    }
    EL.resistMul.disabled = true;
    EL.resistMul.value = "";
  }

  function compute(){
    const atk = toNum(EL.atk.value, 0);
    const def = toNum(EL.def.value, 0);
    const mult = toNum(EL.mult.value, 1);
    const add = toNum(EL.add.value, 0);
    const randMin = toNum(EL.randMin.value, 1);
    const randMax = toNum(EL.randMax.value, 1);
    const selfMul = toNum(EL.selfMul.value, 1);
    const atkCoef = toNum(EL.atkCoef.value, 1);
    const defCoef = toNum(EL.defCoef.value, 0.5);

    const resistMul = getResistMul(EL.resist.value, EL.resistMul.value);

    const base = computeBaseDamage({ atk, def, atkCoef, defCoef, mult, add });
    const range = computeDamageRange({ base, randMin, randMax, resistMul, selfMul });
    const hits = computeHitsToKill({ hp: EL.hp.value, dmgMin: range.min, dmgMax: range.max, dmgAvg: range.avg });

    renderOut({ base, range, resistMul, hits });
  }

  function resetAll(){
    for (const k of Object.keys(EL)){
      const el = EL[k];
      if (!el) continue;
      if (el.tagName === "INPUT") el.value = "";
    }
    EL.resist.value = "normal";
    EL.boss.value = "";
    EL.element.value = "";
    syncResistMulUI();
    EL.bossInfo.textContent = "";
    EL.out.innerHTML = `<div class="small">入力して「計算」を押してください。</div>`;
  }

  async function init(){
    // init dropdowns
    EL.boss.append(opt("", "（ボス未選択）"));

    // Resist select
    for (const [k, label] of Object.entries(RESIST_LABEL)){
      EL.resist.append(opt(k, label));
    }
    EL.resist.value = "normal";

    // Element select
    EL.element.append(opt("", "（属性なし）"));

    // load data
    [bosses, resistTypes, bossResists] = await Promise.all([
      loadCSV("./data/current/bosses.csv"),
      loadCSV("./data/current/resist_types.csv"),
      loadCSV("./data/current/boss_resists.csv"),
    ]);

    bosses
      .slice()
      .sort((a,b)=> (a.name||"").localeCompare((b.name||""), "ja"))
      .forEach(b=>{
        EL.boss.append(opt(b.boss_id, `${b.name}`));
      });

    resistTypes
      .filter(r => (r.category || "") === "呪文属性")
      .slice()
      .sort((a,b)=> Number(a.sort_order||999) - Number(b.sort_order||999))
      .forEach(r=>{
        EL.element.append(opt(r.resist_type_id, `${r.short || r.name}`));
      });

    // URLパラメータ（例: damage.html?boss=boss_001）
    const params = new URLSearchParams(location.search);
    const bossParam = (params.get("boss") || "").toString().trim();
    const elemParam = (params.get("element") || "").toString().trim();
    const resistParam = (params.get("resist") || "").toString().trim();
    const hpParam = (params.get("hp") || "").toString().trim();
    const defParam = (params.get("def") || "").toString().trim();

    if (bossParam && bosses.find(b=> (b.boss_id||"") === bossParam)){
      EL.boss.value = bossParam;
    }
    if (elemParam && resistTypes.find(r=> (r.resist_type_id||"") === elemParam)){
      EL.element.value = elemParam;
    }
    if (resistParam && Object.keys(RESIST_LABEL).includes(resistParam)){
      EL.resist.value = resistParam;
    }
    if (hpParam) fillDefaultIfEmpty(EL.hp, hpParam);
    if (defParam) fillDefaultIfEmpty(EL.def, defParam);

    setBossInfo();
    applyBossDefaults();
    applyResistFromBoss();
    syncResistMulUI();

    // defaults
    EL.out.innerHTML = `<div class="small">入力して「計算」を押してください。</div>`;

    // events
    EL.boss.addEventListener("change", ()=>{
      setBossInfo();
      applyBossDefaults();
      applyResistFromBoss();
      syncResistMulUI();
    });

    EL.element.addEventListener("change", ()=>{
      applyResistFromBoss();
      syncResistMulUI();
    });

    EL.resist.addEventListener("change", ()=>{
      syncResistMulUI();
    });

    EL.calc.addEventListener("click", compute);
    EL.reset.addEventListener("click", resetAll);

    // quick compute on Enter
    document.addEventListener("keydown", (e)=>{
      if (e.key === "Enter"){
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "SELECT")){
          e.preventDefault();
          compute();
        }
      }
    });

    syncResistMulUI();
    setBossInfo();

    // boss/element 指定がある場合は耐性も自動反映しておく
    applyBossDefaults();
    applyResistFromBoss();
  }

  init().catch(err=>{
    EL.out.innerHTML = `<div class="warn">${escapeHTML(err.message || String(err))}</div>`;
  });
</script>

</body>
</html>
