<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>ダメージ計算</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="攻撃力・守備力・倍率からダメージ範囲を計算します（耐性・乱数込み）。" />
</head>
<body>
<main>
  <div class="card">
    <h1>ダメージ計算</h1>

    <p>攻撃力・守備力・技倍率から、ダメージの範囲を計算します。</p>
    

    <div class="toolbar">
      <div class="row" style="gap:10px; flex-wrap:wrap;">
        <div class="field" style="min-width:220px;">
          <label class="small">ボス（任意）</label>
          <select id="boss" class="select"></select>
        </div>

        <div class="field" style="min-width:160px;">
          <label class="small">属性（任意）</label>
          <select id="element" class="select"></select>
        </div>

        <div class="field" style="min-width:140px;">
          <label class="small">相手耐性</label>
          <select id="resist" class="select"></select>
        </div>

        <div class="small" id="bossInfo" style="align-self:flex-end; padding-bottom:6px;"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="row" style="gap:10px; flex-wrap:wrap;">
        <div class="field" style="min-width:130px;">
          <label class="small">攻撃力</label>
          <input id="atk" class="input" inputmode="numeric" placeholder="例: 120" />
        </div>
        <div class="field" style="min-width:140px;">
          <label class="small">攻撃上昇</label>
          <select id="atkStage" class="select">
            <option value="0">なし</option>
            <option value="1">1段階</option>
            <option value="2">2段階</option>
          </select>
        </div>


        <div class="field" style="min-width:130px;">
          <label class="small">相手守備力</label>
          <input id="def" class="input" inputmode="numeric" placeholder="例: 80" />
        </div>
        <div class="field" style="min-width:140px;">
          <label class="small">守備変化</label>
          <select id="defStage" class="select">
            <option value="0">なし</option>
            <option value="-1">-1段階</option>
            <option value="-2">-2段階</option>
            <option value="1">+1段階</option>
            <option value="2">+2段階</option>
          </select>
        </div>


        <div class="field" style="min-width:130px;">
          <label class="small">技倍率</label>
          <input id="mult" class="input" inputmode="decimal" placeholder="例: 1.00" />
        </div>
        <div class="field" style="min-width:140px;">
          <label class="small">相手HP（任意）</label>
          <input id="hp" class="input" inputmode="numeric" placeholder="例: 260" />
        </div>

        <div style="display:flex; gap:8px; align-self:flex-end; padding-bottom:2px;">
          <button id="btnCalc" class="btn primary" type="button">計算</button>
          <button id="btnReset" class="btn" type="button">リセット</button>
        </div>
      </div>
    </div>

    <div id="out" style="margin-top:12px;"></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { escapeHTML } from "./assets/util.js";
  import {
    RESIST_LABEL,
    DEFAULT_DAMAGE_CONFIG,
    normalizeDamageConfig,
    getResistMul,
    toNum,
    computeBaseDamage,
    computeDamageRange,
    computeHitsToKill,
  } from "./assets/damage_calc.js";

  boot("ダメージ計算 | DQ7R");

  const EL = {
    boss: document.getElementById("boss"),
    element: document.getElementById("element"),
    resist: document.getElementById("resist"),
    bossInfo: document.getElementById("bossInfo"),
    atk: document.getElementById("atk"),
    atkStage: document.getElementById("atkStage"),
    def: document.getElementById("def"),
    defStage: document.getElementById("defStage"),
    mult: document.getElementById("mult"),
    hp: document.getElementById("hp"),
    out: document.getElementById("out"),
    calc: document.getElementById("btnCalc"),
    reset: document.getElementById("btnReset"),
  };

  let cfg = DEFAULT_DAMAGE_CONFIG;

  let bosses = [];
  let resistTypes = [];
  let bossResists = [];


  const ATK_STAGE_MUL = [1, 1.25, 1.5];
  const DEF_STAGE_MUL = { "-2": 0.5, "-1": 0.75, "0": 1, "1": 1.25, "2": 1.5 };

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }


  function opt(v, label){
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    return o;
  }

  function fillDefaultIfEmpty(input, value){
    const cur = (input.value || "").toString().trim();
    const v = (value ?? "").toString().trim();
    if (cur !== "") return;
    if (v === "" || v === "null" || v === "undefined") return;
    input.value = v;
  }

  function escape(s){
    return escapeHTML((s ?? "").toString());
  }

  function getSelectedBoss(){
    const id = (EL.boss.value || "").toString();
    return bosses.find(b => (b.boss_id || "").toString() === id) || null;
  }

  function bossResistValue(boss_id, resist_type_id){
    const row = bossResists.find(r => (r.boss_id || "") === boss_id && (r.resist_type_id || "") === resist_type_id);
    return row ? (row.value || "").toString().trim() : "";
  }

  function setBossInfo(){
    const b = getSelectedBoss();
    if (!b){
      EL.bossInfo.textContent = "";
      return;
    }
    const loc = (b.location || "").toString().trim();
    EL.bossInfo.textContent = loc ? `場所: ${loc}` : "";
  }

  function applyBossDefaults(){
    const b = getSelectedBoss();
    if (!b) return;
    fillDefaultIfEmpty(EL.hp, b.hp);
    fillDefaultIfEmpty(EL.def, b.def);
  }

  function applyResistFromBoss(){
    const b = getSelectedBoss();
    const rt = (EL.element.value || "").toString();
    if (!b || !rt) return;

    const v = bossResistValue((b.boss_id || "").toString(), rt);
    if (!v) return;

    const key = ["weak","normal","half","immune","absorb"].includes(v) ? v : "normal";
    EL.resist.value = key;
  }

  function renderOut({ base, range, resistKey, resistMul, hits }){
    const resistLabel = RESIST_LABEL[resistKey] || "等倍";

    const hitsHtml = (hits.best || hits.avg || hits.worst) ? `
      <div class="hr"></div>
      <div class="row" style="gap:10px; flex-wrap:wrap;">
        <div class="pill">撃破目安：最短 <b>${hits.best ?? "—"}</b></div>
        <div class="pill">平均 <b>${hits.avg ?? "—"}</b></div>
        <div class="pill">最長 <b>${hits.worst ?? "—"}</b></div>
      </div>
    ` : "";

    EL.out.innerHTML = `
      <div class="row" style="gap:10px; flex-wrap:wrap;">
        <div class="pill">相手耐性：<b>${escape(resistLabel)}</b></div>
        <div class="pill">耐性倍率：<b>${Number(resistMul).toFixed(2)}</b></div>
      </div>

      <div class="hr"></div>

      <div class="grid2" style="gap:10px;">
        <div class="card" style="padding:12px;">
          <div class="small">基礎ダメージ</div>
          <div style="font-size:22px; font-weight:700;">${Math.round(base)}</div>
        </div>
        <div class="card" style="padding:12px;">
          <div class="small">ダメージ範囲（乱数込み）</div>
          <div style="font-size:22px; font-weight:700;">${range.min} ～ ${range.max}</div>
          <div class="small" style="margin-top:4px;">平均：${Math.round(range.avg)}</div>
        </div>
      </div>

      ${hitsHtml}
    `;
  }

  async function loadConfig(){
    try{
      const r = await fetch("./data/current/damage_config.json", { cache: "no-store" });
      if (!r.ok) return;
      cfg = normalizeDamageConfig(await r.json());
    }catch(e){
      // ignore
    }
  }

  function compute(){
    const atk0 = toNum(EL.atk.value, 0);
    const def0 = toNum(EL.def.value, 0);

    const atkStage = clamp(parseInt((EL.atkStage?.value ?? "0"), 10) || 0, 0, 2);
    const defStage = clamp(parseInt((EL.defStage?.value ?? "0"), 10) || 0, -2, 2);

    const atk = atk0 * ATK_STAGE_MUL[atkStage];
    const def = def0 * DEF_STAGE_MUL[String(defStage)];

    const mult = toNum(EL.mult.value, 1);
    const resistKey = (EL.resist.value || "normal").toString().trim();
    const resistMul = getResistMul(resistKey, cfg);

    const base = computeBaseDamage({ atk, def, mult, cfg });
    const range = computeDamageRange({ base, resistMul, cfg });
    const hits = computeHitsToKill({ hp: EL.hp.value, dmgMin: range.min, dmgMax: range.max, dmgAvg: range.avg });

    renderOut({ base, range, resistKey, resistMul, hits });
  }

  function resetAll(){
    EL.atk.value = "";
    EL.def.value = "";
    if (EL.atkStage) EL.atkStage.value = "0";
    if (EL.defStage) EL.defStage.value = "0";
    EL.mult.value = "";
    EL.hp.value = "";

    EL.boss.value = "";
    EL.element.value = "";
    EL.resist.value = "normal";
    EL.bossInfo.textContent = "";

    EL.out.innerHTML = `<div class="small">入力して「計算」を押してください。</div>`;
  }

  async function init(){
    await loadConfig();

    // boss dropdown
    EL.boss.append(opt("", "（ボス未選択）"));

    // resist dropdown
    for (const [k, label] of Object.entries(RESIST_LABEL)){
      EL.resist.append(opt(k, label));
    }
    EL.resist.value = "normal";

    // element dropdown
    EL.element.append(opt("", "（属性なし）"));

    [bosses, resistTypes, bossResists] = await Promise.all([
      loadCSV("./data/current/bosses.csv"),
      loadCSV("./data/current/resist_types.csv"),
      loadCSV("./data/current/boss_resists.csv"),
    ]);

    bosses
      .slice()
      .sort((a,b)=> (a.name||"").localeCompare((b.name||""), "ja"))
      .forEach(b=>{
        EL.boss.append(opt(b.boss_id, `${b.name}`));
      });

    resistTypes
      .filter(r => (r.category || "") === "呪文属性")
      .slice()
      .sort((a,b)=> Number(a.sort_order||999) - Number(b.sort_order||999))
      .forEach(r=>{
        EL.element.append(opt(r.resist_type_id, `${r.short || r.name}`));
      });

    // URL params: damage.html?boss=boss_001&element=fire
    const params = new URLSearchParams(location.search);
    const bossParam = (params.get("boss") || "").toString().trim();
    const elemParam = (params.get("element") || "").toString().trim();
    const hpParam = (params.get("hp") || "").toString().trim();
    const defParam = (params.get("def") || "").toString().trim();

    if (bossParam && bosses.find(b=> (b.boss_id||"") === bossParam)){
      EL.boss.value = bossParam;
    }
    if (elemParam && resistTypes.find(r=> (r.resist_type_id||"") === elemParam)){
      EL.element.value = elemParam;
    }
    if (hpParam) fillDefaultIfEmpty(EL.hp, hpParam);
    if (defParam) fillDefaultIfEmpty(EL.def, defParam);

    setBossInfo();
    applyBossDefaults();
    applyResistFromBoss();

    EL.out.innerHTML = `<div class="small">入力して「計算」を押してください。</div>`;

    EL.boss.addEventListener("change", ()=>{ setBossInfo(); applyBossDefaults(); applyResistFromBoss(); });
    EL.element.addEventListener("change", ()=>{ applyResistFromBoss(); });
    EL.calc.addEventListener("click", compute);
    EL.reset.addEventListener("click", resetAll);

    document.addEventListener("keydown", (e)=>{
      if (e.key === "Enter"){
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "SELECT")){
          e.preventDefault();
          compute();
        }
      }
    });
  }

  init().catch(err=>{
    EL.out.innerHTML = `<div class="warn">${escape(err.message || String(err))}</div>`;
  });
</script>

</body>
</html>
