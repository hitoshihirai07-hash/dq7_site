<div id="medal-list"></div>

<script type="module">
  import { renderTable } from './assets/csv.js';

  document.addEventListener('DOMContentLoaded', () => {
    renderTable(
      './data/current/medals.csv',
      'medal-list',
      'medal_id',
      [
        { key: 'era', label: '時代' },
        { key: 'area', label: 'エリア' },
        { key: 'location', label: '場所' },
        { key: 'how', label: '入手方法' },
        { key: 'notes', label: '備考' } // メダルCSVにはnotesがあるようなので追加
      ]
    );
  });
</script>
