<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ちいさなメダル | DQ7R Database</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="./assets/app_common.js"></script>
  <style>
    tr.completed { background-color: #f0f0f0; color: #aaa; }
    .check-col { text-align: center; width: 40px; }
    input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <h1><a href="./index.html">DQ7R Database</a></h1>
    </header>
    
    <main class="content">
      <h2>ちいさなメダル入手場所</h2>
      <p>取り逃し防止用のチェックリストです。</p>
      
      <div id="medal-list">読み込み中...</div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 DQ7R Database</p>
    </footer>
  </div>

  <script type="module">
    import { renderTable } from './assets/csv.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderTable(
        './data/current/medals.csv',
        'medal-list',
        'medal_id', // チェックボックス管理用ID
        [
          { key: 'era', label: '時代' },
          { key: 'area', label: 'エリア' },
          { key: 'location', label: '場所' },
          { key: 'how', label: '入手方法' },
          { key: 'notes', label: '備考' }
        ]
      );
    });
  </script>
</body>
</html>
