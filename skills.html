<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】特技一覧｜検索・属性絞り込み</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />  <meta name="description" content="DQ7Rの特技一覧。検索と属性フィルタで絞り込み。火力技・補助/妨害を比較して“今使う技”を決めやすく。" />
</head>
<body>
<main>
  <section class="card">
    <h1>特技</h1>

    <p>特技を一覧表示します。検索で絞り込みできます。</p>

    <div class="toolbar">
      <input id="q" class="input" placeholder="検索（名前 / メモ）" />
<select id="el" class="select">
        <option value="all">属性: 全て</option>
      </select>
    </div>
    <div id="out"></div>
  </section>
<!-- seo-block:start -->
<div class="card">
    <h2>特技の比較が一瞬で終わる</h2>
    <p>特技は似た効果が多く、迷いやすいカテゴリです。検索と属性フィルタで絞り込み、<b>「今の状況で使うべき技」</b>を選びやすくしています。</p>

    <h2>よくある使い方</h2>
    <ul class="list">
      <li>火力技：倍率・属性で候補を絞る</li>
      <li>補助/妨害：目的（守備↓/命中↓など）で検索</li>
      <li>ボスの耐性に合わせて、通る特技を選ぶ</li>
    </ul>

    <h2>関連リンク</h2>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./bosses.html">ボス</a>
      <a class="btn" href="./spells.html">呪文</a>
      <a class="btn" href="./jobs.html">職業</a>
      <a class="btn" href="./damage.html">ダメージ計算</a>
    </div>
  </div>
<!-- seo-block:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { qs, escapeHTML } from "./assets/util.js";

  boot("【DQ7R】特技一覧｜検索・属性絞り込み");

  const Q = qs("#q");  const EL = qs("#el");
  const OUT = qs("#out");

  const COLS = [
    { key:"name", label:"名称" },
    { key:"mp", label:"MP" },
    { key:"element", label:"属性" },
    { key:"target", label:"対象" },
    { key:"power", label:"効果量" },
    { key:"damage_mul", label:"倍率" },
    { key:"hit", label:"回数/命中" },
    { key:"notes", label:"メモ" }]; 

  function norm(s){ return (s||"").toLowerCase(); }

  function renderTable(rows){
    const thead = `<thead><tr>${COLS.map(c=>`<th>${escapeHTML(c.label)}</th>`).join("")}</tr></thead>`;
    const tbody = `<tbody>${rows.map(r=>{
      return `<tr>${COLS.map(c=>{
        if (c.key === "name"){
          const id = (r.skill_id||"").trim();
          const name = r.name || r.skill_id || "";
          return `<td><a href="./skill.html?id=${encodeURIComponent(id)}">${escapeHTML(name)}</a></td>`;
        }
        if (c.key === "mp") return `<td class="num">${escapeHTML((r.mp ?? "").toString().trim())}</td>`;
        if (c.key === "damage_mul"){
          const v = (r.damage_mul ?? "").toString().trim();
          return `<td>${escapeHTML(v || "—")}</td>`;
        }
        if (c.key === "hit") return `<td>${escapeHTML((r.hit ?? "").toString().trim())}</td>`;
        return `<td>${escapeHTML(r[c.key] ?? "")}</td>`;
      }).join("")}</tr>`;
    }).join("")}</tbody>`;
    return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
  }

  async function main(){
    const all = await loadCSV("./data/current/skills.csv");
    const skills = all.filter(r => (r.type||"").trim() === "特技");
const els = Array.from(new Set(skills.map(r=>(r.element||"").trim()).filter(Boolean)))
      .sort((a,b)=>a.localeCompare(b,"ja"));
    EL.innerHTML = `<option value="all">属性: 全て</option>` + els.map(e=>`<option value="${escapeHTML(e)}">${escapeHTML(e)}</option>`).join("");

    function render(){
      const q = norm(Q.value.trim());      const el = EL.value;

      const filtered = skills.filter(r=>{        if (el !== "all" && (r.element||"").trim() !== el) return false;
        if (!q) return true;
        const blob = [r.name,r.notes,r.element,r.target].join(" ").toLowerCase();
        return blob.includes(q);
      });

      OUT.innerHTML = `${renderTable(filtered)}
        <div class="small" style="margin-top:10px;">件数: ${filtered.length}</div>`;
    }

    Q.addEventListener("input", render);    EL.addEventListener("change", render);
    render();
  }

  main().catch(err=>{
    OUT.innerHTML = `<div class="warn">${escapeHTML(err.message || String(err))}</div>`;
  });
</script>
</body>
</html>
