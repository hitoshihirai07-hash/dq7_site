<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>ボス</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7R のボス一覧。検索・絞り込み対応。" />
</head>
<body>
<main>
  <div class="card">
    <h1>ボス</h1>
    <p>ボスを検索して、詳細 → 「このボスでダメージ計算」へ進めます。</p>

    <div class="toolbar">
      <input id="q" class="input" placeholder="検索（名前 / 場所 / メモ）" />
    </div>

    <div id="out" style="margin-top:12px;"></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { qs, escapeHTML } from "./assets/util.js";

  boot("ボス | DQ7R");

  const Q = qs("#q");
  const OUT = qs("#out");

  function norm(s){ return (s||"").toString().toLowerCase(); }
  function trim(s){ return (s||"").toString().trim(); }

  // boss_id 末尾の A/B/C/D をグルーピング用に分解
  // 例: boss_120_A / boss_120A / boss-120-B などを想定
  function splitVariantId(bossId){
    const s = trim(bossId);
    const m = s.match(/^(.*?)(?:[_-])?([A-D])$/i);
    if (!m) return { base:s, variant:"" };
    return { base: m[1], variant: m[2].toUpperCase() };
  }

  const V_ORDER = { "": 0, "A": 1, "B": 2, "C": 3, "D": 4 };

  function groupBosses(rows){
    const map = new Map();

    for (const r of rows){
      const id = trim(r.boss_id);
      if (!id) continue;

      const { base, variant } = splitVariantId(id);
      const item = { ...r, boss_id:id, _base:base, _variant:variant };

      if (!map.has(base)) map.set(base, { base, items:[] });
      map.get(base).items.push(item);
    }

    const groups = [];
    for (const g of map.values()){
      g.items.sort((a,b)=>(V_ORDER[a._variant||""] - V_ORDER[b._variant||""]) || (trim(a.name).localeCompare(trim(b.name),"ja")));
      g.main = g.items.find(x => x._variant === "A") || g.items.find(x => x._variant === "") || g.items[0];
      g.location = trim(g.main.location);
      g.name = trim(g.main.name);
      g.actions_summary = trim(g.main.actions_summary);
      g.notes = trim(g.main.notes);
      g.story_id = trim(g.main.story_id);
      g.subCount = Math.max(0, g.items.length - 1);
      // 検索はグループ内の全情報を拾う（雑魚名で検索しても本ボスが出る）
      g.searchBlob = norm(g.items.map(x=>[x.boss_id,x.name,x.location,x.actions_summary,x.notes].join(" ")).join(" "));
      groups.push(g);
    }

    // 基本は story_id → boss_id で安定ソート（story_idが無い場合は場所→name）
    groups.sort((a,b)=>{
      const sa = a.story_id || "";
      const sb = b.story_id || "";
      if (sa && sb && sa !== sb) return sa.localeCompare(sb, "ja");
      if (a.location !== b.location) return a.location.localeCompare(b.location, "ja");
      return (a.base || "").localeCompare((b.base || ""), "ja");
    });

    return groups;
  }

  function groupByLocation(groups){
    const m = new Map();
    for (const g of groups){
      const loc = g.location || "（場所不明）";
      if (!m.has(loc)) m.set(loc, []);
      m.get(loc).push(g);
    }
    // locationの並びは、groupsの順序を崩さない（最初に出てきた順）
    return Array.from(m.entries());
  }

  function renderLocationBlock(loc, groups){
    const rowsHtml = groups.map(g=>{
      const name = escapeHTML(g.name || g.base);
      const base = escapeHTML(g.base || "");
      const actions = escapeHTML(g.actions_summary || "");
      const notes = escapeHTML(g.notes || "");
      const badge = g.subCount ? `<span class="chip" title="同時出現（本ボス+${g.subCount}体）">同時+${g.subCount}</span>` : "";
      return `<tr>
        <td><a href="./boss.html?id=${encodeURIComponent(g.base)}">${name}</a> ${badge}</td>
        <td>${actions || '<span class="muted">—</span>'}</td>
        <td>${notes || '<span class="muted">—</span>'}</td>
      </tr>`;
    }).join("");

    return `<section class="card" style="margin-top:12px;">
      <h2 style="margin-top:0;">${escapeHTML(loc)}</h2>
      <div class="table-wrap"><table>
        <thead><tr><th style="min-width:220px;">ボス</th><th>行動ざっくり</th><th>メモ</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>
    </section>`;
  }

  async function render(){
    const rows = await loadCSV("./data/current/bosses.csv");
    const groups = groupBosses(rows);

    const q = norm(Q.value.trim());
    const filtered = !q ? groups : groups.filter(g => g.searchBlob.includes(q));

    const byLoc = groupByLocation(filtered);

    const html = byLoc.map(([loc, arr])=>renderLocationBlock(loc, arr)).join("") +
      `<div class="small" style="margin-top:10px;">件数: ${filtered.length}</div>`;

    OUT.innerHTML = html || `<div class="warn">該当するボスが見つかりません。</div>`;
  }

  Q.addEventListener("input", render);
  render();
</script>
</body>
</html>
