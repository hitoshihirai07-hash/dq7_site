<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>呪文・特技詳細</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />  <meta name="description" content="DQ7R の特技詳細ページ。" />
</head>
<body>
<main>
<div class="card" style="margin-bottom:12px;"><h1 style="margin-bottom:6px;">特技詳細</h1><p>呪文・特技一覧から選んで開けます。</p></div>
  <div id="wrap" class="grid two"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV, byId } from "./assets/data.js";
  import { getParam, escapeHTML } from "./assets/util.js";

  boot("呪文・特技詳細 | DQ7R");

  const id = getParam("id") || "";
  const WRAP = document.getElementById("wrap");

  const NA = '<span class="muted">—</span>';
  const disp = (v)=>{
    if (v === 0) return '0';
    const s = (v ?? '').toString().trim();
    return s ? escapeHTML(s) : NA;
  };

  function listCardHtml(title, itemsHtml){
    if (!itemsHtml.length) return `<div class="card"><h2>${escapeHTML(title)}</h2><div class="warn">なし</div></div>`;
    return `<div class="card"><h2>${escapeHTML(title)}</h2>
      <ul class="list">
        ${itemsHtml.map(h=>`<li>${h}</li>`).join("")}
      </ul>
    </div>`;
  }

  async function main(){
    if (!id){
      WRAP.innerHTML = `<div class="card"><h1>呪文・特技詳細</h1><div class="warn">一覧から選んでください。</div><p><a href="./skills.html">← 呪文・特技一覧へ</a></p></div>`;
      return;
    }

    const [skills, jobs, jobSkills] = await Promise.all([
      loadCSV("./data/current/skills.csv"),
      loadCSV("./data/current/jobs.csv"),
      loadCSV("./data/current/job_skills.csv"),
    ]);

    const s = byId(skills, "skill_id", id);
    if (!s){
      WRAP.innerHTML = `<div class="card"><h1>呪文・特技詳細</h1><div class="warn">id=${escapeHTML(id)} が見つかりません。</div><p><a href="./skills.html">← 呪文・特技一覧へ</a></p></div>`;
      return;
    }

    document.title = `${s.name || s.skill_id} | 呪文・特技詳細`;

    const jobById = new Map(jobs.map(j=>[j.job_id, j]));

    const typ = (s.type||'').toString().trim();
    const others = skills.filter(x => (x.skill_id||'').toString().trim() && (x.skill_id||'').toString().trim() !== id);
    let cand = others;
    if (typ){
      const same = others.filter(x => (x.type||'').toString().trim() === typ);
      if (same.length) cand = same.concat(others.filter(x => (x.type||'').toString().trim() !== typ));
    }
    const related = cand.slice(0,3);
    const relatedHtml = related.length ? related.map(x=>`<a class="chip" href="./skill.html?id=${encodeURIComponent((x.skill_id||'').toString().trim())}">${escapeHTML(x.name||x.skill_id||'')}<\/a>`).join(' ') : NA;

    
    const skillName = (s.name||"").toString().trim();

    function hasSkillName_(rowName, targetName){
      const raw = (rowName||"").toString();
      const t = (targetName||"").toString().trim();
      if (!raw || !t) return false;
      const trimmed = raw.trim();
      if (trimmed === t) return true;
      // allow "A、B" / "A,B" / "A・B" style cells
      const parts = trimmed.split(/[、,\/・]/).map(x=>x.trim()).filter(Boolean);
      return parts.includes(t);
    }

    const learnedByJobsHtml = jobSkills
      .filter(r=>{
        const sid = (r.skill_id||"").toString().trim();
        if (sid && sid === id) return true;
        return hasSkillName_(r.skill_name, skillName);
      })
      .map(r=>{
        const j = jobById.get(r.job_id) || {};
        const jid = (r.job_id||"").toString().trim();
        const name = (j.name || jid || "").toString();
        const cond = (r.learn_condition||"").toString().trim();
        const label = cond ? `${name}（${cond}）` : name;
        const safeLabel = escapeHTML(label);
        return jid ? `<a href="./job.html?id=${encodeURIComponent(jid)}">${safeLabel}</a>` : safeLabel;
      });

    const left = `
      <section class="card">
        <h1>${escapeHTML(s.name || "")}</h1>
        <div class="small mono">${escapeHTML(s.skill_id || "")}</div>

        <p>
          <b>種別：</b>${disp(s.type)}<br>
          <b>属性：</b>${disp(s.element)}<br>
          <b>対象：</b>${disp(s.target)}
        </p>

        <p>
          <b>効果量：</b>${disp(s.power)}<br>
          <b>回数/命中：</b>${disp(s.hit)}<br>
          <b>倍率：</b>${disp(s.damage_mul)}
        </p>

        <p><b>メモ</b><br>${disp(s.notes)}</p>

        <p><b>関連</b><br>${relatedHtml}</p>

        <p class="small"><a href="${(s.type||"").trim()==="呪文" ? "./spells.html" : "./skills.html"}">← 一覧へ戻る</a></p>
      </section>
    `;

    const right = `
      <section class="grid">
        ${listCardHtml("習得：職業", learnedByJobsHtml)}
      </section>
    `;

    WRAP.innerHTML = left + right;
  }

  main().catch(err=>{
    WRAP.innerHTML = `<div class="card"><h1>呪文・特技詳細</h1><div class="warn">${escapeHTML(err.message || String(err))}</div><p><a href="./skills.html">← 呪文・特技一覧へ</a></p></div>`;
  });
</script>
</body>
</html>
