<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>強モンスター</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7R の強モンスター一覧。出現場所・ドロップを検索/絞り込みで確認。" />
</head>
<body>
<main>
  <section class="card">
    <h1>強モンスター</h1>

    <p>各地に出現する強モンスターを一覧表示します。検索で「場所」「ドロップ」までまとめて絞り込みできます。</p>

    <div class="toolbar">
      <input id="q" class="input" placeholder="検索（モンスター / 場所 / ドロップ）" />
      <select id="era" class="select">
        <option value="all">時代: 全て</option>
      </select>
    </div>

    <div id="out"></div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { qs, escapeHTML } from "./assets/util.js";

  boot("強モンスター | DQ7R");

  const Q = qs("#q");
  const ERA = qs("#era");
  const OUT = qs("#out");

  const norm = (s) => (s ?? "").toString().toLowerCase().replace(/\s+/g, " ").trim();

  function detectEra(loc){
    const t = (loc ?? "").toString().trim();
    if (t.startsWith("過去")) return "過去";
    if (t.startsWith("現代")) return "現代";
    return "その他";
  }

  function renderTable(rows){
    const cols = [
      {key:"No", label:"#", right:true},
      {key:"name", label:"強モンスター"},
      {key:"location", label:"出現場所"},
      {key:"hp", label:"HP", right:true},
      {key:"atk", label:"攻撃", right:true},
      {key:"def", label:"防御", right:true},
      {key:"drop", label:"ドロップ"},
    ];
    const thead = `<thead><tr>${cols.map(c=>`<th class="${c.right?'num':''}">${escapeHTML(c.label)}</th>`).join("")}</tr></thead>`;
    const tbody = `<tbody>${rows.map(r=>{
      return `<tr>
        <td class="num">${escapeHTML(String(r.No ?? ""))}</td>
        <td>${escapeHTML(r.name ?? "")}</td>
        <td>${escapeHTML(r.location ?? "")}</td>
        <td class="num">${escapeHTML((r.hp ?? "").toString().trim() || "—")}</td>
        <td class="num">${escapeHTML((r.atk ?? "").toString().trim() || "—")}</td>
        <td class="num">${escapeHTML((r.def ?? "").toString().trim() || "—")}</td>
        <td>${escapeHTML(r.drop ?? "")}</td>
      </tr>`;
    }).join("")}</tbody>`;
    return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
  }

  async function main(){
    const raw = await loadCSV("./data/current/strong_monster.csv");
    const rows = raw.map(r => ({
      No: Number(r["No"] ?? r["NO"] ?? r["no"] ?? r["番号"] ?? r["No."] ?? r["No "] ?? r["No"] ?? 0),
      name: (r["強モンスター"] ?? r["モンスター"] ?? r["name"] ?? "").toString().trim(),
      location: (r["出現場所"] ?? r["場所"] ?? r["location"] ?? "").toString().trim(),
      hp: (r["HP"] ?? r["hp"] ?? "").toString().trim(),
      atk: (r["攻撃"] ?? r["atk"] ?? "").toString().trim(),
      def: (r["防御"] ?? r["def"] ?? "").toString().trim(),
      drop: (r["ドロップ"] ?? r["drop"] ?? "").toString().trim(),
      _blob: ""
    })).map(r => ({...r, era: detectEra(r.location), _blob: norm([r.name,r.location,r.hp,r.atk,r.def,r.drop].join(" "))}))
      .sort((a,b)=> (a.No||0) - (b.No||0));

    const eras = Array.from(new Set(rows.map(r=>r.era))).sort((a,b)=>a.localeCompare(b,"ja"));
    ERA.innerHTML = `<option value="all">時代: 全て</option>` + eras.map(e=>`<option value="${escapeHTML(e)}">${escapeHTML(e)}</option>`).join("");

    function render(){
      const q = norm(Q.value);
      const era = ERA.value;

      const filtered = rows.filter(r=>{
        if (era !== "all" && r.era !== era) return false;
        if (!q) return true;
        return r._blob.includes(q);
      });

      OUT.innerHTML = `${renderTable(filtered)}
        <div class="small" style="margin-top:10px;">件数: ${filtered.length}</div>`;
    }

    Q.addEventListener("input", render);
    ERA.addEventListener("change", render);
    render();
  }

  main().catch(err=>{
    OUT.innerHTML = `<div class="warn">${escapeHTML(err.message || String(err))}</div>`;
  });
</script>
</body>
</html>
