<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】職業詳細｜条件・習得</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7Rの職業詳細。条件・習得（呪文/特技）などを確認できます。" />
</head>
<body>
<main>
<div class="card" style="margin-bottom:12px;"><h1 style="margin-bottom:6px;">職業詳細</h1><p>職業一覧から選んで開けます。</p></div>
  <div id="wrap" class="grid two"></div>
<!-- seo-detail:start -->
<div class="card">
    <h2>職業詳細の見方</h2>
    <p>このページでは、職業の条件や習得（呪文・特技）を確認できます。欲しい習得から逆算するなら、呪文・特技一覧もあわせて見ると早いです。</p>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./jobs.html">職業一覧</a>
      <a class="btn" href="./spells.html">呪文</a>
      <a class="btn" href="./skills.html">特技</a>
      <a class="btn" href="./characters.html">キャラクター</a>
    </div>
  </div>
<!-- seo-detail:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
                <a href="./updates.html">更新履歴</a>
<a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>
<script type="module">

  import { boot } from "./assets/app_common.js";
  import { loadCSV, byId } from "./assets/data.js";
  import { getParam, escapeHTML, makeTable } from "./assets/util.js";

  function parseStage_(s){
    const t = (s||"").toString();
    const m = t.match(/[★☆]\s*([0-9]+)/);
    if (m) return parseInt(m[1], 10) || 9999;
    const m2 = t.match(/([0-9]+)\s*(?:段階|ステップ)/);
    if (m2) return parseInt(m2[1], 10) || 9999;
    return 9999;
  }

  boot("職業詳細 | DQ7R");

  const id = getParam("id") || "";
  const WRAP = document.getElementById("wrap");

  const NA = '<span class="muted">—</span>';
  const disp = (v)=>{
    if (v === 0) return '0';
    const s = (v ?? '').toString().trim();
    return s ? escapeHTML(s) : NA;
  };

  
  function stageMark_(v){
    const s = (v ?? "").toString().trim();
    if (!s) return "－";
    // allow values like 10, -10, 0, 10%, +10%, ↑, ↓, －
    if (s === "↑" || s === "↓" || s === "－") return s;
    const num = parseFloat(s.replace("%",""));
    if (Number.isNaN(num) || num === 0) return "－";
    return num > 0 ? "↑" : "↓";
  }

  function bonusRows_(job){
    const rows = [
      ["HP", stageMark_(job.hp_pct)],
      ["MP", stageMark_(job.mp_pct)],
      ["攻撃力", stageMark_(job.str_pct)],
      ["守備力", stageMark_(job.def_pct)],
      ["攻撃魔力", stageMark_(job.atk_magic_pct ?? job.int_pct)],
      ["回復魔力", stageMark_(job.heal_magic_pct)],
      ["魅力", stageMark_(job.charm_pct)],
      ["素早さ", stageMark_(job.agi_pct)],
      ["器用さ", stageMark_(job.dex_pct)],
    ];
    return rows;
  }


  async function main(){
    if (!id){
      WRAP.innerHTML = `
        <div class="card">
          <h1>職業詳細</h1>
          <div class="small">職業一覧から選んでください。</div>
          <p class="small"><a href="./jobs.html">← 職業一覧へ</a></p>
        </div>
      `;
      return;
    }

    const [jobs, skills, jobSkills] = await Promise.all([
      loadCSV("./data/current/jobs.csv"),
      loadCSV("./data/current/skills.csv"),
      loadCSV("./data/current/job_skills.csv"),
    ]);

    const job = byId(jobs, "job_id", id);
    if (!job){
      WRAP.innerHTML = `
        <div class="card">
          <h1>職業詳細</h1>
          <div class="warn">指定された職業が見つかりません。</div>
          <p class="small"><a href="./jobs.html">← 職業一覧へ</a></p>
        </div>
      `;
      return;
    }

    document.title = `${job.name || job.job_id} | 職業詳細`;
    // meta description (for SERP snippet)
    const nm = (job.name || job.job_id || "").toString();
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', `DQ7Rの職業「${nm}」の詳細。条件・習得（呪文/特技）を確認。`);


        const grp = (job.group||"").toString().trim();
    const others = jobs.filter(x => (x.job_id||"").toString().trim() && (x.job_id||"").toString().trim() !== id);
    let cand = others;
    if (grp){
      const same = others.filter(x => (x.group||"").toString().trim() === grp);
      if (same.length) cand = same.concat(others.filter(x => (x.group||"").toString().trim() !== grp));
    }
    const related = cand.slice(0,3);
    const relatedHtml = related.length ? related.map(x=>`<a class="chip" href="./job.html?id=${encodeURIComponent((x.job_id||"").toString().trim())}">${escapeHTML(x.name||x.job_id||"")}</a>`).join(' ') : NA;


    const skillsById = new Map(skills.map(s=>[(s.skill_id||"").toString().trim(), s]).filter(x=>x[0]));
    const skillsByName = new Map();
    for (const s of skills){
      const n = (s.name||"").toString().trim();
      if (!n) continue;
      if (!skillsByName.has(n)) skillsByName.set(n, s);
    }

    const learns = jobSkills
      .filter(js => (js.job_id||"").toString().trim() === id)
      .map(js=>{
        const rawId = (js.skill_id || "").toString().trim();
        const rawName = (js.skill_name || js.name || "").toString().trim();

        let s = null;
        if (rawId && skillsById.has(rawId)) s = skillsById.get(rawId);
        else if (rawName && skillsByName.has(rawName)) s = skillsByName.get(rawName);

        const sid = s ? (s.skill_id||"").toString().trim() : "";
        const name = rawName || (s ? (s.name||"").toString().trim() : "");
        const type = s ? (s.type||"").toString().trim() : ((js.type||"").toString().trim());
        const notes = s ? (s.notes||"").toString().trim() : ((js.notes||"").toString().trim());

        return {
          sort: (js.sort_order ? (parseInt(js.sort_order,10) || 9999) : parseStage_(js.learn_condition)),
          timing: (js.learn_condition||js.timing||"").toString().trim(),
          skill_id: sid,
          name,
          type,
          notes,
        };
      })
      .filter(r=> (r.name||"").trim())
      .sort((a,b)=>a.sort-b.sort || a.name.localeCompare(b.name,"ja"));
const learnCols = [
      { key:"timing", label:"段階" },
      {
        key:"name", label:"習得",
        render:(r)=>{ const n = escapeHTML(r.name||""); const sid = (r.skill_id||"").trim(); return sid ? `<a href="./skill.html?id=${encodeURIComponent(sid)}">${n}</a>` : n; }
      },
      { key:"notes", label:"メモ" },
    ];

    const bRows = bonusRows_(job);
    const bonusHtml = bRows.length ? `
      <div class="card">
        <h2>ステータス補正</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>項目</th><th>補正</th></tr></thead>
            <tbody>
              ${bRows.map(r=>`<tr><td>${escapeHTML(r[0])}</td><td>${escapeHTML(r[1])}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
    ` : "";

    WRAP.innerHTML = `
      <div class="card">
        <h1>${escapeHTML(job.name || "")}</h1>
        <div class="kv">
          <div><div class="k">系統</div><div class="v">${disp(job.group)}</div></div>
          <div><div class="k">条件</div><div class="v">${disp(job.unlock_condition)}</div></div>
          <div><div class="k">特性</div><div class="v">${disp(job.job_traits)}</div></div>
          <div><div class="k">メモ</div><div class="v">${disp(job.notes)}</div></div>
        </div>
        <p><b>関連職業</b><br>${relatedHtml}</p>
        <p class="small"><a href="./jobs.html">← 職業一覧へ</a></p>
      </div>

      ${bonusHtml}

      <div class="card">
        <h2>習得（呪文・特技）</h2>
        ${makeTable(learns, learnCols)}
        <div class="small" style="margin-top:8px;">件数: ${learns.length}</div>
      </div>
    `;
  }

  main().catch(err=>{
    WRAP.innerHTML = `<div class="card"><h1>職業詳細</h1><div class="warn">${escapeHTML(err.message || String(err))}</div><p class="small"><a href="./jobs.html">← 職業一覧へ</a></p></div>`;
  });

</script>
</body>
</html>
