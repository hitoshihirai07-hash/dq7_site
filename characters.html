<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】キャラ一覧｜仲間・主要キャラを検索</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />
  <meta name="description" content="DQ7Rのキャラクター一覧。名前検索で仲間・主要キャラを素早く確認。職業・呪文・特技の確認導線も。" />
</head>
<body>
<main>
  <div class="card">
    <h1>キャラクター</h1>

    <p>キャラクターを一覧表示します。検索で絞り込み、名前を押すと詳細ページに移動します。</p>

    <div class="toolbar">
      <input id="q" class="input" placeholder="検索（名前 / 概要 / メモ）" />
</div>

    <div id="out" style="margin-top:12px;"></div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h2>ステータス計算</h2>
    <p>キャラ・レベル・2つの職業を選ぶと、素の値と職業補正率、計算後の値を確認できます。</p>

    <div class="toolbar">
      <select id="calcCharacter" aria-label="キャラ選択"></select>
      <select id="calcLevel" aria-label="レベル選択"></select>
      <select id="calcJob1" aria-label="1つ目の職業選択"></select>
      <select id="calcJob2" aria-label="2つ目の職業選択"></select>
    </div>

    <div id="calcSummary" class="status-grid" style="margin-top:12px;"></div>
    <div id="calcOut" style="margin-top:12px;"></div>
    <div class="small" id="calcNote" style="margin-top:8px;"></div>
  </div>
<!-- seo-block:start -->
<div class="card">
    <h2>仲間・主要キャラを検索して確認</h2>
    <p>キャラクターを一覧表示し、検索で絞り込みできます。名前から詳細に移動できるので、装備・職業・習得の確認など、攻略中の「確認したいだけ」を<b>最短</b>で終わらせます。</p>

    <h2>関連リンク</h2>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./jobs.html">職業</a>
      <a class="btn" href="./spells.html">呪文</a>
      <a class="btn" href="./skills.html">特技</a>
      <a class="btn" href="./items.html">アイテム</a>
    </div>
  </div>
<!-- seo-block:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
                <a href="./updates.html">更新履歴</a>
<a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>
<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV } from "./assets/data.js";
  import { qs, escapeHTML, makeTable } from "./assets/util.js";

  boot("【DQ7R】キャラ一覧｜仲間・主要キャラを検索");

  const Q = qs("#q");
  const OUT = qs("#out");
  const calcCharacter = qs("#calcCharacter");
  const calcLevel = qs("#calcLevel");
  const calcJob1 = qs("#calcJob1");
  const calcJob2 = qs("#calcJob2");
  const calcSummary = qs("#calcSummary");
  const calcOut = qs("#calcOut");
  const calcNote = qs("#calcNote");

  const statKeys = ["HP","MP","ちから","みのまもり","攻撃魔力","回復魔力","素早さ","きようさ","魅力"];
  const primaryStats = ["HP","MP","ちから","みのまもり"];

  const cols = [
    {
      key:"name",
      label:"名前",
      render:(r)=>{
        const id = (r.chara_id || "").trim();
        const name = escapeHTML(r.name || "");
        return `<a href="./character.html?id=${encodeURIComponent(id)}">${name}</a>`;
      }
    },
    { key:"join_chapter", label:"加入" },
    { key:"profile_short", label:"概要" },
    { key:"notes", label:"メモ" }
  ];

  function norm(s){ return (s||"").toLowerCase(); }
  function num(v){
    const n = Number(v);
    return Number.isFinite(n) ? Math.round(n) : 0;
  }

  function hasValue(v){
    return v != null && String(v).trim() !== "";
  }

  function isVisibleLevelRow(row){
    const keys = ["HP","MP","ちから","みのまもり","攻撃魔力","回復魔力","素早さ","きようさ","魅力","経験値","次レベル"];
    return keys.every((k) => hasValue(row[k]));
  }

  function calcWithJobs(baseValue, pct1, pct2){
    const base = Number(baseValue || 0);
    const p1 = Number(pct1 || 0);
    const p2 = Number(pct2 || 0);
    return Math.round(base + (base * p1) / 100 + (base * p2) / 100);
  }

  let characters = [];
  let baseRows = [];
  let jobRows = [];
  const charById = new Map();
  const rowsByCharacter = new Map();
  const jobsByName = new Map();

  function characterName(id){
    return charById.get(id)?.name || id;
  }

  function renderCharacterList(){
    const q = norm(Q.value.trim());
    const filtered = characters.filter(r=>{
      if (!q) return true;
      const blob = [r.chara_id,r.name,r.join_chapter,r.profile_short,r.notes].join(" ").toLowerCase();
      return blob.includes(q);
    });
    OUT.innerHTML = makeTable(filtered, cols) + `<div class="small" style="margin-top:8px;">件数: ${filtered.length}</div>`;
  }

  function fillCharacterSelect(){
    calcCharacter.innerHTML = characters.map(r=>`<option value="${escapeHTML(r.chara_id)}">${escapeHTML(r.name)}</option>`).join("");
  }

  function fillJobSelects(){
    const options = [`<option value="">なし</option>`].concat(
      jobRows.map(r=>`<option value="${escapeHTML(r["職業"] || "")}">${escapeHTML(r["職業"] || "")}</option>`)
    ).join("");
    calcJob1.innerHTML = options;
    calcJob2.innerHTML = options;
  }

  function fillLevelSelect(charaId, preferredLevel = null){
    const rows = (rowsByCharacter.get(charaId) || []).filter(isVisibleLevelRow);
    calcLevel.innerHTML = rows.map(r=>{
      const lv = String(r["レベル"] || "");
      return `<option value="${escapeHTML(lv)}">Lv ${escapeHTML(lv)}</option>`;
    }).join("");
    if (preferredLevel && rows.some(r => String(r["レベル"]) === String(preferredLevel))) {
      calcLevel.value = String(preferredLevel);
    }
  }

  function statCard(label, value, sub = ""){
    return `<div class="status-card"><div class="status-label">${escapeHTML(label)}</div><div class="status-value">${escapeHTML(String(value))}</div>${sub ? `<div class="status-sub">${escapeHTML(sub)}</div>` : ``}</div>`;
  }

  function renderCalc(){
    const charaId = calcCharacter.value;
    const level = calcLevel.value;
    const jobName1 = calcJob1.value;
    const jobName2 = calcJob2.value;
    const rows = (rowsByCharacter.get(charaId) || []).filter(isVisibleLevelRow);
    const base = rows.find(r => String(r["レベル"]) === String(level));
    const job1 = jobName1 ? jobsByName.get(jobName1) : null;
    const job2 = jobName2 ? jobsByName.get(jobName2) : null;

    if (!base) {
      calcSummary.innerHTML = "";
      calcOut.innerHTML = "<p>データが見つかりません。</p>";
      calcNote.textContent = "";
      return;
    }

    const cards = [];
    for (const key of primaryStats) {
      const baseValue = num(base[key]);
      const pct1 = job1 ? num(job1[key]) : 0;
      const pct2 = job2 ? num(job2[key]) : 0;
      const total = calcWithJobs(baseValue, pct1, pct2);
      const parts = [];
      if (job1) parts.push(`${jobName1} ${pct1 > 0 ? `+${pct1}` : pct1}%`);
      if (job2) parts.push(`${jobName2} ${pct2 > 0 ? `+${pct2}` : pct2}%`);
      cards.push(statCard(key, total, `${baseValue}${parts.length ? ` / ${parts.join(" / ")}` : " / 補正なし"}`));
    }
    cards.push(statCard("経験値", num(base["経験値"])));
    cards.push(statCard("次レベル", num(base["次レベル"])));
    calcSummary.innerHTML = cards.join("");

    const tableRows = statKeys.map((key) => {
      const baseValue = num(base[key]);
      const pct1 = job1 ? num(job1[key]) : 0;
      const pct2 = job2 ? num(job2[key]) : 0;
      const total = calcWithJobs(baseValue, pct1, pct2);
      const bonus1 = Math.round((baseValue * pct1) / 100);
      const bonus2 = Math.round((baseValue * pct2) / 100);
      return {
        項目: key,
        元の値: String(baseValue),
        1つ目補正: job1 ? `${jobName1} (${pct1 > 0 ? `+${pct1}` : pct1}%) / ${bonus1 > 0 ? `+${bonus1}` : bonus1}` : "なし",
        2つ目補正: job2 ? `${jobName2} (${pct2 > 0 ? `+${pct2}` : pct2}%) / ${bonus2 > 0 ? `+${bonus2}` : bonus2}` : "なし",
        計算後: String(total)
      };
    });

    calcOut.innerHTML = makeTable(tableRows, [
      { key:"項目", label:"項目" },
      { key:"元の値", label:"元の値" },
      { key:"1つ目補正", label:"1つ目の職業" },
      { key:"2つ目補正", label:"2つ目の職業" },
      { key:"計算後", label:"計算後" }
    ]);

    const charName = characterName(charaId);
    const jobText1 = jobName1 || "なし";
    const jobText2 = jobName2 || "なし";
    calcNote.textContent = `${charName} / Lv ${level} / 1つ目: ${jobText1} / 2つ目: ${jobText2}`;
  }

  async function init(){
    [characters, baseRows, jobRows] = await Promise.all([
      loadCSV("./data/current/characters.csv"),
      loadCSV("./data/current/characters_data.csv"),
      loadCSV("./data/current/jobs_value.csv")
    ]);

    characters.forEach(r => charById.set(r.chara_id, r));
    for (const row of baseRows) {
      const id = row["キャラID"] || "";
      if (!rowsByCharacter.has(id)) rowsByCharacter.set(id, []);
      rowsByCharacter.get(id).push(row);
    }
    for (const rows of rowsByCharacter.values()) {
      rows.sort((a,b)=> num(a["レベル"]) - num(b["レベル"]));
    }
    for (const row of jobRows) {
      jobsByName.set(row["職業"], row);
    }

    renderCharacterList();
    fillCharacterSelect();
    fillJobSelects();
    const firstId = characters[0]?.chara_id || "";
    if (firstId) {
      calcCharacter.value = firstId;
      fillLevelSelect(firstId, (rowsByCharacter.get(firstId) || []).filter(isVisibleLevelRow)?.[0]?.["レベル"] || "1");
      calcJob1.value = "";
      calcJob2.value = "";
      renderCalc();
    }
  }

  Q.addEventListener("input", renderCharacterList);
  calcCharacter.addEventListener("change", ()=>{
    const currentLevel = calcLevel.value;
    fillLevelSelect(calcCharacter.value, currentLevel);
    renderCalc();
  });
  calcLevel.addEventListener("change", renderCalc);
  calcJob1.addEventListener("change", renderCalc);
  calcJob2.addEventListener("change", renderCalc);

  init().catch((err)=>{
    console.error(err);
    OUT.innerHTML = `<p>データの読み込みに失敗しました。</p>`;
    calcOut.innerHTML = `<p>ステータス計算の読み込みに失敗しました。</p>`;
  });
</script>
</body>
</html>
