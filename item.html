<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】アイテム詳細｜用途・入手メモ</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />  <meta name="description" content="DQ7Rのアイテム詳細。用途・入手メモ・カテゴリなどを確認できます。" />
  <meta name="robots" content="noindex,follow" />
</head>
<body>
<main>
<div class="card" style="margin-bottom:12px;"><h1 style="margin-bottom:6px;">アイテム詳細</h1><p>アイテム一覧から選んで開けます。</p></div>
  <div id="wrap"></div>
<!-- seo-detail:start -->
<div class="card">
    <h2>アイテム詳細の見方</h2>
    <p>このページでは、アイテムの用途・入手メモなどを確認できます。取り逃しが不安な語があれば、取り逃しQ&Aでも同じ語で検索できます。</p>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./items.html">アイテム一覧</a>
      <a class="btn" href="./missables.html">取り逃しQ&A</a>
      <a class="btn" href="./lucky_panel.html">ラッキーパネル</a>
    </div>
  </div>
<!-- seo-detail:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
                <a href="./updates.html">更新履歴</a>
<a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { loadCSV, byId } from "./assets/data.js";
  import { getParam, escapeHTML } from "./assets/util.js";

  boot("アイテム詳細 | DQ7R");

  const id = getParam("id") || "";
  const WRAP = document.getElementById("wrap");

  const NA = '<span class="muted">—</span>';
  const disp = (v)=>{
    if (v === 0) return '0';
    const s = (v ?? '').toString().trim();
    return s ? escapeHTML(s) : NA;
  };

  async function main(){
    if (!id){

    WRAP.innerHTML = `<section class="card"><h1>アイテム詳細</h1><div class="warn">アイテム一覧から選んでください。</div><p><a href="./items.html">← アイテム一覧へ</a></p></section>`;
      return;
    }

    const items = await loadCSV("./data/current/items.csv");
    const it = byId(items, "item_id", id);

    if (!it){
      WRAP.innerHTML = `<section class="card"><h1>アイテム詳細</h1><div class="warn">id=${escapeHTML(id)} が見つかりません。</div><p><a href="./items.html">← アイテム一覧へ</a></p></section>`;
      return;
    }

    document.title = `${it.name || it.item_id} | アイテム詳細`;
    // meta description (for SERP snippet)
    const nm = (it.name || it.item_id || "").toString();
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', `DQ7Rのアイテム「${nm}」の詳細。用途・入手メモなどを確認。`);


    const cat = (it.category||"").toString().trim();
    const others = items.filter(x => (x.item_id||"").toString().trim() && (x.item_id||"").toString().trim() !== id);
    let cand = others;
    if (cat){
      const same = others.filter(x => (x.category||"").toString().trim() === cat);
      if (same.length) cand = same.concat(others.filter(x => (x.category||"").toString().trim() !== cat));
    }
    const related = cand.slice(0,3);
    const relatedHtml = related.length ? related.map(x=>`<a class="chip" href="./item.html?id=${encodeURIComponent((x.item_id||"").toString().trim())}">${escapeHTML(x.name||x.item_id||"")}</a>`).join(' ') : NA;

    WRAP.innerHTML = `
      <section class="card">
        <h1>${escapeHTML(it.name || "")}</h1>
        <div class="small mono">${escapeHTML(it.item_id || "")}</div>

        <p>
          <b>カテゴリ：</b>${disp(it.category)}<br>
          ${ (it.era||"").trim() ? `<br><b>時代：</b>${escapeHTML(it.era || "")}` : `` }
          ${ (it.obtain||"").trim() ? `<br><b>入手：</b>${escapeHTML(it.obtain || "")}` : `` }

        </p>

        <p>
          <b>上昇量：</b>${(() => { const boosts = [it.atk, it.def].map(v => (v ?? '').toString().trim()).filter(Boolean); return boosts.length ? escapeHTML(boosts.join(' / ')) : NA; })()}<br>
          <b>倍率：</b>${disp(it.damage_mul)}
        </p>

        <p>
          <b>買値：</b>${disp(it.price_buy)}　
          <b>売値：</b>${disp(it.price_sell)}
        </p>

        <p><b>効果</b><br>${disp(it.effect)}</p>
        <p><b>メモ</b><br>${disp(it.notes)}</p>
        <p><b>関連アイテム</b><br>${relatedHtml}</p>

        <p class="small"><a href="./items.html">← アイテム一覧へ戻る</a></p>
      </section>
    `;
  }

  main().catch(err=>{
    WRAP.innerHTML = `<section class="card"><h1>アイテム詳細</h1><div class="warn">${escapeHTML(err.message || String(err))}</div><p><a href="./items.html">← アイテム一覧へ</a></p></section>`;
  });
</script>
</body>
</html>
