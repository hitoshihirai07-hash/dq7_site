<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ラッキーパネル景品一覧 | DQ7R Database</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="./assets/app_common.js"></script>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <h1><a href="./index.html">DQ7R Database</a></h1>
    </header>
    
    <main class="content">
      <h2>ラッキーパネル景品一覧</h2>
      <p>カジノのラッキーパネルで入手できるアイテムのリストです。</p>
      
      <div id="prize-list">読み込み中...</div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 DQ7R Database</p>
    </footer>
  </div>

  <script type="module">
    import { renderTable } from './assets/csv.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 第三引数を null にすることでチェックボックスなしの通常テーブルになります
      renderTable(
        './lucky_panel_prize.csv', // GitHub上のファイル名に合わせてください
        'prize-list',
        null, 
        [
          { key: '景品', label: '景品名' },
          { key: 'ランク', label: 'ランク' },
          { key: 'ダーマ旅の宿過去', label: '過去ダーマ' },
          { key: 'ダーマ旅の宿現代', label: '現代ダーマ' }
        ]
      );
    });
  </script>
</body>
</html>
