<div id="tablet-list"></div>

<script type="module">
  import { renderTable } from './assets/csv.js';

  // ページ読み込み時に実行
  document.addEventListener('DOMContentLoaded', () => {
    renderTable(
      './data/current/tablets.csv', // CSVのパス
      'tablet-list',                // 表示する場所のID
      'tablet_id',                  // ID列の名前（CSVの1行目と合わせる）
      [                             // 表示したい列の設定
        { key: 'era', label: '時代' },
        { key: 'area', label: 'エリア' },
        { key: 'location', label: '詳細場所' },
        { key: 'color', label: '色' },
        { key: 'how', label: '入手方法' }
      ]
    );
  });
</script>
