<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
  <title>【DQ7R】石板｜入手・条件の確認</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#e8892f" />  <meta name="description" content="DQ7Rの石板を確認。入手メモや条件を整理して、詰まりやすいポイントの時間を短縮。" />
</head>
<body>
<main>
  <section class="card">
    <h1>石板</h1>

    <p>石板の一覧を、CSVの並び順そのままで表示します。チェックして進捗管理できます（保存はこの端末のローカルのみ）。</p>

    <div class="toolbar">
      <input id="q" class="input" placeholder="検索（エリア / 色 / 時代 / 場所 / 方法）" />
      <select id="area" class="select">
        <option value="all">エリア: 全て</option>
      </select>
      <select id="era" class="select">
        <option value="all">時代: 全て</option>
        <option value="過去">過去</option>
        <option value="現代">現代</option>
      </select>
      <label class="chip" style="cursor:pointer;">
        <input id="onlyUnchecked" type="checkbox" style="vertical-align:middle; margin-right:6px;">
        未チェックのみ
      </label>
      <button id="reset" class="btn ghost" type="button">チェック全解除</button>
    </div>

    <div class="progress">
      <div class="progress-row">
        <div class="small">チェック数: <b id="done">0</b> / <b id="total">0</b></div>
        <div class="small" id="pct">0%</div>
      </div>
      <progress id="bar" value="0" max="100"></progress>
    </div>

    <div id="out"></div>
  </section>
<!-- seo-block:start -->
<div class="card">
    <h2>石板を“詰まらないように”整理する</h2>
    <p>石板は不足や見落としが起きやすい要素です。入手場所と方法を確認しやすい形でまとめ、必要な石板を探す時間を短縮します。</p>
    <h2>関連リンク</h2>
    <div class="toolbar" style="gap:8px; flex-wrap:wrap; align-items:center;">
      <a class="btn" href="./missables.html">取り逃しQ&A</a>
      <a class="btn" href="./items.html">アイテム</a>
      <a class="btn" href="./characters.html">キャラクター</a>
    </div>
  </div>
<!-- seo-block:end -->
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-note">
      <div class="footer-links">
        <a href="./about.html">このサイトについて</a>
                <a href="./updates.html">更新履歴</a>
<a href="./privacy.html">プライバシーポリシー</a>
        <a href="./contact.html">お問い合わせ</a>
      </div>
      <div class="small" style="margin-top:6px;">※非公式ファンサイトです。掲載情報は参考用です。</div>
    </div>
    <div class="footer-copy small">© 2026 DQ7R データベース</div>
  </div>
</footer>

<script type="module">
  import { boot } from "./assets/app_common.js";
  import { qs, escapeHTML } from "./assets/util.js";

  boot("【DQ7R】石板｜入手・条件の確認");

  const STORAGE_KEY = "dq7_tablets_checked_v2";

  const Q = qs("#q");
  const AREA = qs("#area");
  const ERA = qs("#era");
  const ONLY = qs("#onlyUnchecked");
  const RESET = qs("#reset");
  const OUT = qs("#out");
  const DONE = qs("#done");
  const TOTAL = qs("#total");
  const PCT = qs("#pct");
  const BAR = qs("#bar");

  const PARAMS = new URLSearchParams(location.search);
  const QP_RAW = PARAMS.get("q") || "";
  const QP = (QP_RAW || "").toString().replace(/【[^】]*】/g, " ").replace(/#[0-9]+/g, " ").replace(/\s+/g, " ").trim();
  const ERAP = PARAMS.get("era") || "";
  const AREAP = PARAMS.get("area") || "";
  if (QP) Q.value = QP;

  function norm(s){ return (s || "").toLowerCase(); }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const obj = JSON.parse(raw);
      return (obj && typeof obj === "object") ? obj : {};
    } catch (e) {
      return {};
    }
  }

  function saveState(state){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function updateProgress(total, done){
    TOTAL.textContent = String(total);
    DONE.textContent = String(done);
    const pct = total ? Math.round((done / total) * 100) : 0;
    PCT.textContent = pct + "%";
    BAR.max = 100;
    BAR.value = pct;
  }

  function renderTable(rows, state){
    const thead = `
      <thead><tr>
        <th style="width:84px;">チェック</th>
        <th>エリア</th>
        <th style="width:84px;">色</th>
        <th style="width:84px;">時代</th>
        <th>場所</th>
        <th>方法</th>
      </tr></thead>
    `;

    const tbody = `<tbody>${rows.map(r => {
      const id = String(r._id);
      const checked = !!state[id];
      const badge = checked ? `<span class="chip ok">済</span>` : `<span class="chip">未</span>`;
      return `
        <tr>
          <td>
            <label style="display:flex; gap:8px; align-items:center; cursor:pointer;">
              <input type="checkbox" class="tablet-cb" data-id="${escapeHTML(id)}" ${checked ? "checked" : ""}>
              ${badge}
            </label>
          </td>
          <td>${escapeHTML(r.area || "")}</td>
          <td>${escapeHTML(r.color || "")}</td>
          <td>${escapeHTML(r.era || "")}</td>
          <td>${escapeHTML(r.location || "")}</td>
          <td>${escapeHTML(r.how || "")}</td>
        </tr>
      `;
    }).join("")}</tbody>`;

    return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
  }

  function parseCSVRows(text){
    const rows = [];
    let i = 0, field = '', row = [];
    let inQuotes = false;
    text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  async function loadTablets(){
    const res = await fetch("./data/current/tablets.csv", { cache: "no-store" });
    if (!res.ok) throw new Error(`データ読込失敗: ./data/current/tablets.csv (${res.status})`);
    const text = await res.text();
    const rows = parseCSVRows(text);
    if (!rows.length) return [];

    return rows.slice(1)
      .filter(cols => cols.some(v => (v || '').trim() !== ''))
      .map((cols, idx) => ({
        _id: idx + 1,
        area: (cols[0] || '').trim(),
        color: (cols[1] || '').trim(),
        era: (cols[2] || '').trim(),
        location: (cols[3] || '').trim(),
        how: (cols[4] || '').trim(),
      }));
  }

  async function main(){
    const tablets = await loadTablets();

    const areas = Array.from(new Set(tablets.map(r => (r.area || "").trim()).filter(Boolean)));
    AREA.innerHTML = `<option value="all">エリア: 全て</option>` + areas.map(a => `<option value="${escapeHTML(a)}">${escapeHTML(a)}</option>`).join("");

    const eras = Array.from(new Set(tablets.map(r => (r.era || "").trim()).filter(Boolean)));
    const order = { "過去": 1, "現代": 2 };
    eras.sort((a, b) => (order[a] || 99) - (order[b] || 99) || a.localeCompare(b, "ja"));
    ERA.innerHTML = `<option value="all">時代: 全て</option>` + eras.map(e => `<option value="${escapeHTML(e)}">${escapeHTML(e)}</option>`).join("");

    if (AREAP && areas.includes(AREAP)) AREA.value = AREAP;
    if (ERAP && eras.includes(ERAP)) ERA.value = ERAP;

    let state = loadState();

    function render(){
      const q = norm(Q.value.trim());
      const area = AREA.value;
      const era = ERA.value;
      const only = ONLY.checked;

      const filtered = tablets.filter(r => {
        const id = String(r._id);
        if (area !== "all" && (r.area || "").trim() !== area) return false;
        if (era !== "all" && (r.era || "").trim() !== era) return false;
        if (only && state[id]) return false;
        if (!q) return true;
        const blob = [r.area, r.color, r.era, r.location, r.how].join(" ").toLowerCase();
        return blob.includes(q);
      });

      const total = tablets.length;
      const done = tablets.filter(r => state[String(r._id)]).length;
      updateProgress(total, done);

      OUT.innerHTML = renderTable(filtered, state) + `<div class="small" style="margin-top:10px;">表示件数: ${filtered.length}</div>`;

      OUT.querySelectorAll(".tablet-cb").forEach(cb => {
        cb.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-id");
          state[id] = e.target.checked;
          saveState(state);
          render();
        });
      });
    }

    RESET.addEventListener("click", () => {
      state = {};
      saveState(state);
      render();
    });

    Q.addEventListener("input", render);
    AREA.addEventListener("change", render);
    ERA.addEventListener("change", render);
    ONLY.addEventListener("change", render);

    render();
  }

  main().catch(err => {
    OUT.innerHTML = `<div class="warn">${escapeHTML(err.message || String(err))}</div>`;
  });
</script>
</body>
</html>
